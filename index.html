  const clash = clashShift(s, opts.leave, opts.applied);
  const closed = band === "full" || band === "over";
  let selectable = false;
  if (opts.stage === "choose") selectable = mine;
  else if (clash) selectable = false;
  else if (mine || leaving) selectable = true;
  else if (closed) selectable = opts.canExceed;
  else selectable = true;
  return {
    slot: s,
    count,
    max,
    band,
    needs: !hasDiscipline(s) && !joining && !closed && !clash,
    mine,
    leaving,
    joining,
    clash,
    joinIndex: opts.join.indexOf(s.id) + 1,
    selectable,
    canUndoLeave: leaving && opts.leave.length > 1,
    staff: opts.role !== "plf",
  };
}
function cellClass(st, base) {
  const c = [base];
  if (st.leaving) c.push(base + "--leaving");
  else if (st.joining) c.push(base + "--join");
  else if (st.mine) c.push(base + "--mine");
  else if (st.clash) c.push(base + "--clash");
  else c.push(base + "--" + st.band);
  if (st.needs) c.push(base + "--heat", base + "--needs");
  if (st.staff && (st.band === "full" || st.band === "over") && !st.leaving && !st.joining && !st.mine && !st.clash) {
    c.push(base + "--staff");
  }
  c.push(st.selectable ? base + "--click" : base + "--off");
  return c.join(" ");
}
function cellLabel(st) {
  const s = st.slot;
  const place = s.day + " " + s.start + ", " + CAMPUS[s.campus].name;
  if (st.clash) {
    return place + ", Clash. Already on " + CAMPUS[st.clash.campus].name + " at this time.";
  }
  if (st.leaving) {
    return place + ", Leaving. " + (st.canUndoLeave ? "Tap to keep this hour." : "Keep at least one hour.");
  }
  if (st.mine) return place + ", Your shift. Tap to leave this hour.";
  if (st.joining) return place + ", Joining as choice " + st.joinIndex + ". Tap to remove.";
  if (st.band === "full" || st.band === "over") {
    let text = place + ", Full. " + CAMPUS[s.campus].name + " fits " + st.max + ".";
    if (st.staff) text += " " + st.count + " of " + st.max + ".";
    if (st.staff && st.band === "over") text += " " + (st.count - st.max) + " over.";
    if (!st.selectable) text += " Not available.";
    return text;
  }
  let text = place + ", " + st.count + " of " + st.max + ", " + BAND_WORD[st.band] + ".";
  if (st.needs) text += " No " + DISCIPLINE.short + ".";
  return text;
}
function onActivate(e, st, onPick) {
  if (e.key !== "Enter" && e.key !== " ") return;
  e.preventDefault();
  if (!st.selectable) return;
  onPick(st.slot.id);
}

function useIslandFlags() {

function isOverCap(id, caps) {
  const s = byId(id);
  if (!s) return false;
  return s.people.length >= capOf(s, caps);
}
function ConfirmSide(props) {
  const reasonRef = useRef(null);
  const panelRef = useRef(null);

  const [trayOpen, setTrayOpen] = useState(false);
  const overIds = props.join.filter((id) => isOverCap(id, props.caps));
  const over = overIds.length > 0 && props.canExceed;
  const matched = props.leave.length === props.join.length && props.leave.length > 0;
  const remaining = props.leave.length - props.join.length;
  useEffect(() => {
    if (!over && props.confirming) props.onConfirming(false);
  }, [over]);
  useEffect(() => {
    const root = document.querySelector(".mvs");
    if (!root) return undefined;
    if (props.stacked) {
      root.dataset.trayOpen = trayOpen ? "1" : "0";
      root.style.setProperty("--tray", trayOpen ? "46vh" : "88px");
    } else {
      delete root.dataset.trayOpen;
      root.style.setProperty("--tray", "0px");

    return undefined;
  }, [trayOpen, props.stacked]);
  useEffect(() => {
    if (props.confirming && panelRef.current) panelRef.current.focus();
  }, [props.confirming]);
  function review() {
    const text = props.reason.trim();
    if (!text) {
      setReasonError("Enter a reason to place this person in a full hour.");
      if (reasonRef.current) reasonRef.current.focus();
      return;
    }
    setReasonError("");
    props.onConfirming(true);
  }
  function editReason() {
    props.onConfirming(false);
    setTimeout(() => { if (reasonRef.current) reasonRef.current.focus(); }, 0);
  }
  if (props.stacked && !trayOpen) {
    return (
      <div className="side side--bar">

        </button>
      </div>

  }
  const weekLabel = prettyWeek(props.week);
  return (
    <div className="side" onBlur={(e) => {

        <div className="side__match" aria-live="polite">

                </div>
                {props.leave.length > 1 ? (
                  <button type="button" className="pick__x" aria-label={"Keep " + fmtSlot(s)} onClick={() => props.onDropLeave(id)}>×</button>
                ) : (
                  <span className="pick__meta">Keep 1</span>

        <div className="side__group">
          <div className="side__label">Joining</div>

              <div key={id} className={"pick pick--join" + (stale ? " pick--stale" : "")}>

                  {stale ? <div className="pick__warn">This hour filled up. Pick another one.</div> : null}

              </div>

          {Array.from({ length: Math.max(0, props.leave.length - props.join.length) }, (_, i) => (
            <div key={"wait-" + i} className="waiting">
              <span className="waiting__n">{props.join.length + i + 1}</span>
              <span className="waiting__t">Choose an hour</span>

            <button type="button" className="btn btn--primary btn--block" onClick={() => props.onApply(props.reason.trim())}>

          </>
        ) : (
          <button

            {over ? "Review over-cap move..." : props.self ? "Confirm move" : "Apply move"}
          </button>
        )}
        <button type="button" className="btn btn--link" onClick={props.onBack}>Back to step 1</button>
        {props.stacked ? (
          <button type="button" className="btn btn--link" onClick={() => setTrayOpen(false)}>Hide details</button>

        <p className="side__note">

        </p>
      </div>
    </div>
  );

function PlfSearch(props) {
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState(0);
  const boxRef = useRef(null);
  const matches = PLFS.filter((p) => (p.name + " " + p.studentNumber).toLowerCase().indexOf(q.trim().toLowerCase()) >= 0);
  useEffect(() => { setActive(0); }, [q]);
  useEffect(() => {
    function onDoc(e) {
      if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  function choose(p) {
    props.onPick(p.name);
    setQ("");
    setOpen(false);
  }
  function onKey(e) {
    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (!open) setOpen(true);
      else setActive((i) => Math.min(i + 1, Math.max(matches.length - 1, 0)));
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      setActive((i) => Math.max(i - 1, 0));
    } else if (e.key === "Enter" && open && matches[active]) {
      e.preventDefault();
      choose(matches[active]);
    } else if (e.key === "Escape") {
      setOpen(false);
    }
  }
  return (
    <div className="plfpick" ref={boxRef}>
      <label className="plfpick__label" htmlFor="plf-search">PLF</label>
      <div className="plfpick__field">
        <input
          id="plf-search"
          className="search"
          role="combobox"
          aria-expanded={open}
          aria-controls="plf-list"
          aria-autocomplete="list"
          aria-activedescendant={open && matches[active] ? "plf-opt-" + active : undefined}
          placeholder="Search by name or student number"
          value={open ? q : props.who}
          onFocus={() => { setOpen(true); setQ(""); }}
          onChange={(e) => { setQ(e.target.value); setOpen(true); }}
          onKeyDown={onKey}
          onBlur={(e) => {
            if (boxRef.current && !boxRef.current.contains(e.relatedTarget)) setOpen(false);
          }}
        />
        <div className="sr" aria-live="polite">{open ? matches.length + " matches" : ""}</div>
        <ul id="plf-list" className="plfpick__menu" role="listbox" hidden={!open}>
          {matches.length === 0 ? <li className="plfpick__none">No PLF matches that search.</li> : matches.map((p, i) => (
            <li
              key={p.studentNumber}
              id={"plf-opt-" + i}
              role="option"
              aria-selected={i === active}
              className="plfpick__opt"
              onMouseDown={(e) => { e.preventDefault(); choose(p); }}
            >
              <span>{p.name}</span>
              <span className="plfpick__num">{p.studentNumber}</span>
            </li>
          ))}
        </ul>
      </div>
      <span className="pill">{DISCIPLINE.short}</span>
    </div>
  );
}

function MoveFlow(props) {

  const [view, setView] = useCanvasState(keyp + "view", "week");
  const [viewChose, setViewChose] = useCanvasState(keyp + "vchose", false);

  const [needsOnly, setNeedsOnly] = useCanvasState(keyp + "fneeds", false);
  const [day, setDay] = useCanvasState(keyp + "fday", "All");

  const [query, setQuery] = useCanvasState(keyp + "fq", "");
  const [reason, setReason] = useCanvasState(keyp + "reason", "");

  const [live, setLive] = useState("");

  const canExceed = props.role !== "plf";
  const stale = [];
  function st(s) {
    return stateOf(s, { caps: props.caps, applied, leave, join, stage, role: props.role, canExceed });
  }
  useEffect(() => {
    const heading = document.getElementById("move-heading");
    if (heading) heading.focus();
    setLive(stage === "choose" ? "Step 1 of 3. Choose hours to leave." : "Step 2 of 3. Pick hours to join.");
  }, [stage]);
  useEffect(() => {
    if (viewChose) return;
    setView(flags.narrow ? "list" : "week");
  }, [flags.narrow, viewChose]);
  const prevOver = useRef(0);
  const overCount = canExceed ? join.filter((id) => isOverCap(id, props.caps)).length : 0;
  useEffect(() => {
    if (overCount > 0 && prevOver.current === 0) {
      setLive("Staff may place this person in a full hour if you record a reason.");
    }
    prevOver.current = overCount;
  }, [overCount]);

  function toggleLeave(id) {
    setLeave(leave.indexOf(id) >= 0 ? leave.filter((x) => x !== id) : leave.concat([id]));
  }
  function toggleJoin(id) {
    if (join.indexOf(id) >= 0) {
      setJoin(join.filter((x) => x !== id));
      return;
    }
    if (join.length >= leave.length) return;
    setJoin(join.concat([id]));
  }
  function dropLeave(id) {
    if (leave.length <= 1) return;
    const next = leave.filter((x) => x !== id);
    setLeave(next);
    if (join.length > next.length) setJoin(join.slice(0, next.length));
  }
  function pick(id) {
    const s = byId(id);
    if (!s) return;
    const state = st(s);
    if (!state.selectable) return;
    if (state.mine || state.leaving || MY_SHIFTS.indexOf(id) >= 0) {
      if (leave.indexOf(id) >= 0) dropLeave(id);
      else setLeave(leave.concat([id]));
      return;
    }
    toggleJoin(id);
  }
  function reset() {
    setStage("choose");
    setLeave([]);
    setJoin([]);
    setApplied(null);
    setReason("");
    setConfirming(false);
  }
  function onWeek(value) {
    if (!value) return;
    const next = sundayIso(value);
    if (next === props.week) return;
    props.onWeek(next);
    setLeave([]);
    setJoin([]);
    setConfirming(false);
    setStage("choose");
  }
  const mine = SLOTS.filter((s) => MY_SHIFTS.indexOf(s.id) >= 0 && (!applied || applied.leave.indexOf(s.id) < 0));
  const how = props.self
    ? "Move hours you cannot make to other open hours for this week only. Your regular weekly roster stays the same, and your total hours for the week stay the same. (Permanent moves for future weeks will arrive in Phase 2.)"
    : "Move hours for a PLF for the selected week only. Their regular weekly roster and total hours for the week stay the same. (Permanent moves will arrive in Phase 2.)";

  if (stage === "choose") {
    const noRoster = SLOTS.filter((s) => MY_SHIFTS.indexOf(s.id) >= 0).length === 0;
    return (
      <div className="page page--step1">
        <div className="sr" aria-live="polite">{live}</div>
        <div className="pg__banner">
          <WeekHeading title={props.self ? "Move a Shift" : "Move a Shift for a PLF"} staff={!props.self} week={props.week} onWeek={onWeek} />
          <Steps stage={stage} />
        </div>
        <p className="pg__sub" style={{ marginBottom: 16 }}>{how}</p>
        <div className="step1panel">
          {!props.self ? (
            <div className="step1panel__who">
              <PlfSearch who={props.who} onPick={(n) => props.onPickWho && props.onPickWho(n)} />
            </div>
          ) : null}
          {mine.length === 0 ? (
            <div className="empty">
              <div className="empty__t">{noRoster ? "No rostered hours this week" : "No hours available to move this week"}</div>
              <div className="empty__s">
                {noRoster
                  ? "Add your availabilities so the team can roster you. Once hours are assigned, you can move them here."
                  : "Marked absent hours cannot be moved."}
              </div>
              {noRoster && props.self ? <a className="btn btn--primary" href="#availabilities">Add availabilities</a> : null}
            </div>
          ) : (
            <>
              {!props.self ? <div className="step1panel__hint">Select the hours {props.who} should leave</div> : null}
              <div>
                {mine.map((s) => {
                  const on = leave.indexOf(s.id) >= 0;
                  return (
                    <button key={s.id} type="button" className={"pickrow" + (on ? " pickrow--on" : "")} aria-pressed={on} onClick={() => toggleLeave(s.id)}>
                      <span className={"pickrow__box" + (on ? " pickrow__box--on" : "")} aria-hidden="true">{on ? <Check /> : null}</span>
                      <span className="pickrow__main">
                        <span className="pickrow__when">{s.day} {s.start}</span>
                        <span className="pickrow__where">{CAMPUS[s.campus].name}</span>
                      </span>
                    </button>
                  );
                })}
              </div>
              <div className="step1panel__foot">
                <span className="pickrow__where" aria-live="polite">{leave.length} of {mine.length} selected</span>
                <button type="button" className="btn btn--primary" disabled={leave.length === 0} onClick={() => setStage("join")}>Continue</button>
              </div>
            </>
          )}
        </div>
        {props.self ? (
          <p className="step1__abs">
            Cannot make it at all? <a className="btn btn--link" href="#absence">Report an absence</a> instead.
          </p>
        ) : null}
      </div>
    );
  }

  const visible = SLOTS.filter((s) => {
    const state = st(s);
    const pinned = state.mine || state.leaving || state.joining;
    if (openOnly && state.band !== "needs" && !pinned) return false;
    if (needsOnly && hasDiscipline(s) && !pinned) return false;
    if (day !== "All" && s.day !== day && !pinned) return false;
    if (s.campus !== campus) return false;
    if (query) {
      const hay = (s.day + " " + s.start + " " + CAMPUS[s.campus].name + " " + s.people.map((p) => p.name).join(" ")).toLowerCase();
      if (hay.indexOf(query.toLowerCase()) < 0) return false;
    }
    return true;
  });
  const showGrid = view === "week" && !(flags.narrow && !viewChose);
  const showList = view === "list" || (flags.narrow && !viewChose);
  const grid = {};
  visible.forEach((s) => { grid[s.day + "-" + s.timeKey] = s; });
  const campusOff = campus !== PRIMARY_CAMPUS;
  const activeFilters = (openOnly ? 1 : 0) + (needsOnly ? 1 : 0) + (day !== "All" ? 1 : 0) + (campusOff ? 1 : 0) + (query ? 1 : 0);
  return (
    <div className="page">
      <div className="sr" aria-live="polite">{live}</div>
      <div className="pg__banner">
        <div>
          <button type="button" className="btn btn--back" onClick={() => setStage("choose")}><BackArrow /> Back</button>
          <div style={{ height: 8 }} />
          <WeekHeading title={props.self ? "Move a Shift" : "Move a Shift for " + props.who} staff={!props.self} week={props.week} onWeek={onWeek} />
        </div>
        <Steps stage={stage} />
      </div>
      <div className="work">
        <div className="work__main">
          <div className="board">
            <Filters
              view={view}
              campus={campus}
              day={day}
              query={query}
              openOnly={openOnly}
              needsOnly={needsOnly}
              active={activeFilters}
              onView={(next) => { setViewChose(true); setView(next); }}
              onCampus={setCampus}
              onDay={setDay}
              onQuery={setQuery}
              onOpen={() => setOpenOnly(!openOnly)}
              onNeeds={() => setNeedsOnly(!needsOnly)}
              onClear={() => { setOpenOnly(false); setNeedsOnly(false); setDay("All"); setCampus(PRIMARY_CAMPUS); setQuery(""); }}
            />
            <div className="sr" aria-live="polite">{visible.length} hours shown</div>
            {visible.length === 0 ? (
              <div className="empty">
                <div className="empty__t">No hours match these filters</div>
                <div className="empty__s">Clear a filter to see more of the week.</div>
              </div>
            ) : null}
            {showGrid ? (
              <div className="gridwrap">
                <table className="grid">
                  <caption className="sr">{CAMPUS[campus].name} week</caption>
                  <thead>
                    <tr>
                      <th className="grid__time" scope="col">Time</th>
                      {DAYS.map((d) => <th key={d} scope="col">{d}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {TIMES.map((t) => (
                      <tr key={t.key}>
                        <th className="grid__time" scope="row">{t.label}</th>
                        {DAYS.map((d) => {
                          const s = grid[d + "-" + t.key];
                          return (
                            <td key={d}>
                              {s ? <SlotCell st={st(s)} showExact={props.showExact} onPick={pick} /> : <span className="cell cell--empty" />}
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            ) : null}
            {showList ? (
              <div className="list">
                {visible.map((s) => <SlotRow key={s.id} st={st(s)} showExact={props.showExact} onPick={pick} />)}
              </div>
            ) : null}
          </div>
        </div>
        <div className="work__side">
          <ConfirmSide
            who={props.who}
            self={props.self}
            leave={leave}
            join={join}
            caps={props.caps}
            canExceed={canExceed}
            stale={stale}
            week={props.week}
            stacked={flags.stacked}
            reason={reason}
            onReason={setReason}
            confirming={confirming}
            onConfirming={setConfirming}
            onDropLeave={dropLeave}
            onDropJoin={(id) => setJoin(join.filter((x) => x !== id))}
            onApply={(text) => { props.onApplied(leave, join, text); reset(); }}
            onBack={() => setStage("choose")}
          />
        </div>
      </div>
    </div>
  );
}

      )}

  );
}

      <div className="pg__banner">
        <div className="pg__head">
          <h1 className="pg__title">Move a Shift Settings</h1>
          <p className="pg__sub">Administrators only. Duty hosts can move shifts but cannot change these.</p>
        </div>
      </div>
      <div className="sec">
        <h2 className="sec__title">Capacity per campus</h2>

              <input className="num" type="number" min={1} name="capGp" value={props.caps.gp} onChange={(e) => props.onCaps({ gp: Math.max(1, parseInt(e.target.value || "1", 10)), kg: props.caps.kg })} />
              <span>per hour</span>

          </label>
          <label className="captile">

            <span className="captile__hint">Smaller rooms</span>
            <span className="captile__row">
              <input className="num" type="number" min={1} name="capKg" value={props.caps.kg} onChange={(e) => props.onCaps({ gp: props.caps.gp, kg: Math.max(1, parseInt(e.target.value || "1", 10)) })} />
              <span>per hour</span>

      <div className="sec">
        <h2 className="sec__title">Rules</h2>
        <div className="rules">
          <div className="rule">
            <label className="rule__check">
              <input className="sw" type="checkbox" name="showExact" checked={props.showExact} onChange={() => { props.onShowExact(!props.showExact); setSaved(false); }} />
              <span className="rule__main">
                <span className="rule__label">Show exact numbers to PLFs on full hours</span>
                <span className="rule__hint">Duty hosts and admins always see the count. This only changes the PLF view.</span>
              </span>
            </label>
            <span className="rule__prev">
              <span className="rule__prevlabel">A PLF sees</span>
              <span className="rule__prevcell">
                <span className="cell__state">Full</span>
                {props.showExact ? <span className="cell__hint">10 of 10</span> : null}
              </span>
            </span>
          </div>
          <div className="rule">

              <input className="sw" type="checkbox" name="exceedCap" checked disabled />
              <span className="rule__main">
                <span className="rule__label">SSPs and admins may exceed capacity</span>

              </span>

      <div className="settings__save">
        <button type="submit" className="btn btn--primary">Save settings</button>
      </div>
      {saved ? <p className="note note--ok" role="status">Settings saved.</p> : null}
    </form>
  );
}

function PageState(props) {

function AbsenceReallocationPhase1Prototype() {
  const [role, setRole] = useCanvasState("mvs_role", "plf");
  const [screen, setScreen] = useCanvasState("mvs_screen", "move");
  const [caps, setCaps] = useCanvasState("mvs_caps", DEFAULT_CAPS);
  const [showExact, setShowExact] = useCanvasState("mvs_exact", false);
  const [moves, setMoves] = useCanvasState("mvs_moves", SEED_MOVES);
  const [who, setWho] = useCanvasState("mvs_who", PLFS[0].name);
  const [week, setWeek] = useCanvasState("mvs_week", DEFAULT_WEEK);
  const [toast, setToast] = useCanvasState("mvs_toast", null);
  const [pageState, setPageState] = useState("ready");
  const [navOpen, setNavOpen] = useState(false);
  useEffect(() => { setNavOpen(false); }, [screen, role, pageState]);
  useEffect(() => {
    if (!toast) return undefined;
    const t = setTimeout(() => setToast(null), 8000);
    return () => clearTimeout(t);
  }, [toast]);
  useEffect(() => {
    const main = document.querySelector(".mvs__main");
    const root = document.querySelector(".mvs");
    if (!main || !root) return undefined;
    const read = () => {
      const w = main.clientWidth;
      const stacked = w < 1020;
      root.classList.toggle("is-stacked", stacked);
      root.classList.toggle("is-narrow", w < 720);
      const open = root.dataset.trayOpen === "1";
      root.style.setProperty("--tray", stacked ? (open ? "46vh" : "88px") : "0px");
    };
    read();
    const ro = new ResizeObserver(read);
    ro.observe(main);
    return () => ro.disconnect();
  }, [screen, pageState]);
  useEffect(() => {
    function apply() {
      const h = location.hash.replace("#", "");
      if (h === "absence") setScreen("absence");
      if (h === "availabilities") setScreen("avail");
    }
    window.addEventListener("hashchange", apply);
    apply();
    return () => window.removeEventListener("hashchange", apply);
  }, []);
  const isPlf = role === "plf";
  const exactFor = isPlf ? showExact : true;
  const nav = isPlf
    ? [{ id: "move", label: "Move a Shift" }, { id: "absence", label: "Report an Absence" }]
    : role === "ssp"
      ? [{ id: "active", label: "Active Shift Moves" }, { id: "assign", label: "Move a Shift for a PLF" }]
      : [
        { id: "active", label: "Active Shift Moves" },
        { id: "assign", label: "Move a Shift for a PLF" },
        { id: "settings", label: "Move a Shift Settings" },
      ];
  const allowed = nav.map((n) => n.id);
  const current = allowed.indexOf(screen) >= 0 ? screen : screen === "avail" || screen === "absence" ? screen : nav[0].id;
  function applyMove(plf, leave, join, by, reason) {
    const next = {
      id: Date.now(),
      plf,
      leave: leave.map((id) => { const s = byId(id); return s ? fmtSlot(s) : id; }),
      join: join.map((id) => { const s = byId(id); return s ? fmtSlot(s) : id; }),
      by,
      status: "active",
      weekOf: prettyWeek(week),
      overflowReason: reason || undefined,
    };
    setMoves([next].concat(moves));
    setToast(role === "ssp" ? "ssp" : "ok");
  }
  const roleTitle = role === "admin" ? "Administrator" : role === "ssp" ? "Duty Host" : "PLF";
  return (
    <div className={"mvs" + (navOpen ? " nav-open" : "")}>
      <style>{CSS}</style>
      <a className="skip" href="#main">Skip to content</a>
      <header className="mvs__bar">
        <button type="button" className="mvs__navtoggle" aria-label={navOpen ? "Close menu" : "Open menu"} aria-expanded={navOpen} onClick={() => setNavOpen(!navOpen)}>
          <NavChevron open={navOpen} />
        </button>
        <div className="mvs__brand">Student Success - STEM Support</div>
        <span className="mvs__spacer" />
        <label className="mvs__preview">
          Page
          <select data-preview-state value={pageState} onChange={(e) => setPageState(e.target.value)}>
            <option value="ready">Ready</option>
            <option value="loading">Loading</option>
            <option value="error">Could not load</option>
            <option value="session">Session expired</option>
          </select>
        </label>
        <div className="mvs__demo">
          <span id="preview-as">Preview as</span>
          <div className="seg" role="radiogroup" aria-labelledby="preview-as">
            <button type="button" role="radio" aria-checked={role === "plf"} onClick={() => { setRole("plf"); setScreen("move"); }}>PLF</button>
            <button type="button" role="radio" aria-checked={role === "ssp"} onClick={() => { setRole("ssp"); setScreen("active"); }}>SSP</button>
            <button type="button" role="radio" aria-checked={role === "admin"} onClick={() => { setRole("admin"); setScreen("active"); }}>Admin</button>
          </div>
        </div>
        <div className="mvs__who-block">
          <div className="mvs__who-name">Jack A</div>
          <div className="mvs__who-role">{roleTitle}</div>
        </div>
      </header>
      <button type="button" className="mvs__scrim" aria-label="Close menu" onClick={() => setNavOpen(false)} />
      <div className="mvs__body">
        <nav className="mvs__nav" aria-label="Primary">
          <div className="mvs__navhead">{isPlf ? "My roster" : "Administration"}</div>
          {nav.map((n) => (
            <button key={n.id} type="button" className="mvs__navitem" data-on={current === n.id ? "1" : "0"} onClick={() => { setScreen(n.id); setNavOpen(false); }}>
              {n.label}
            </button>
          ))}
        </nav>
        <main id="main" className={"mvs__main" + (toast && pageState === "ready" ? " has-toast" : "")} tabIndex={-1}>
          {toast && pageState === "ready" ? (
            <div className="toast" role="status">
              <p>Move applied.</p>
              {toast === "ssp" ? (
                <button type="button" className="btn btn--link" onClick={() => { setScreen("active"); setToast(null); }}>Active Shift Moves</button>
              ) : null}
              <button type="button" className="btn btn--link" onClick={() => setToast(null)}>Close</button>
            </div>
          ) : null}
          {pageState !== "ready" ? (
            <PageState kind={pageState} onRetry={() => setPageState("ready")} />
          ) : current === "move" ? (
            <MoveFlow self who="You" role={role} caps={caps} showExact={exactFor} week={week} onWeek={setWeek} onApplied={(leave, join) => applyMove("You", leave, join, "Self", "")} />
          ) : current === "absence" ? (
            <ReportAbsenceStub />
          ) : current === "avail" ? (
            <AvailStub />
          ) : current === "assign" ? (
            <MoveFlow self={false} who={who} role={role} caps={caps} showExact week={week} onWeek={setWeek} onPickWho={setWho} onApplied={(leave, join, reason) => { applyMove(who, leave, join, role === "admin" ? "Jack A (Admin)" : "Jack A (SSP)", reason); setScreen("active"); }} />
          ) : current === "settings" ? (
            <Settings caps={caps} onCaps={setCaps} showExact={showExact} onShowExact={setShowExact} />
          ) : (
            <ActiveMoves moves={moves} week={week} onAssign={() => setScreen("assign")} />
          )}
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AbsenceReallocationPhase1Prototype />);
  </script>
</body>
</html>
