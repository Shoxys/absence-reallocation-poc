const { useState, useEffect } = React;

/* Shared keyed state — mirrors Cursor useCanvasState across components */
const __canvasStore = new Map();
const __canvasListeners = new Map();

function useCanvasState(key, initial) {
  const init =
    typeof initial === "function" ? initial : () => initial;
  if (!__canvasStore.has(key)) {
    __canvasStore.set(key, init());
  }
  const [value, setLocal] = useState(() => __canvasStore.get(key));
  useEffect(() => {
    const bump = (next) => setLocal(next);
    let set = __canvasListeners.get(key);
    if (!set) {
      set = new Set();
      __canvasListeners.set(key, set);
    }
    set.add(bump);
    setLocal(__canvasStore.get(key));
    return () => set.delete(bump);
  }, [key]);
  const setValue = (action) => {
    const prev = __canvasStore.get(key);
    const next = typeof action === "function" ? action(prev) : action;
    __canvasStore.set(key, next);
    const set = __canvasListeners.get(key);
    if (set) for (const fn of set) fn(next);
  };
  return [value, setValue];
}

/* Host theme stand-in (canvas useHostTheme) */
const hostTheme = {
  kind: "light",
  accent: { primary: "#1F6FBF" },
  stroke: { secondary: "#E4E9EF", tertiary: "#EEF1F5" },
  fill: { primary: "#EEF5FC", tertiary: "#E4EAF0", quaternary: "#eceff2" },
  bg: { elevated: "#ffffff", editor: "#F6F8FA", chrome: "#F6F8FA" },
  text: { primary: "#1B2430", secondary: "#5A6572", tertiary: "#8B95A1" },
};

function Stack({ gap = 8, children, style }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap, ...style }}>
      {children}
    </div>
  );
}

function Row({ gap = 8, align = "stretch", wrap, children, style }) {
  return (
    <div
      style={{
        display: "flex",
        flexDirection: "row",
        gap,
        alignItems:
          align === "center" ? "center" : align === "stretch" ? "stretch" : align,
        flexWrap: wrap ? "wrap" : "nowrap",
        ...style,
      }}
    >
      {children}
    </div>
  );
}

function Spacer() {
  return <div style={{ flex: 1, minWidth: 8 }} />;
}

function Divider() {
  return (
    <hr
      style={{
        border: "none",
        borderTop: `1px solid ${hostTheme.stroke.secondary}`,
        margin: 0,
      }}
    />
  );
}

function H1({ children, style }) {
  return (
    <h1 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: "#1B2430", ...style }}>
      {children}
    </h1>
  );
}

function Text({ children, size = "md", weight = "normal", tone = "primary", style }) {
  const fontSize = size === "small" ? 12 : 14;
  const fontWeight = weight === "semibold" ? 600 : 400;
  const color =
    tone === "secondary"
      ? hostTheme.text.secondary
      : tone === "tertiary"
        ? hostTheme.text.tertiary
        : hostTheme.text.primary;
  return (
    <span style={{ fontSize, fontWeight, color, ...style }}>{children}</span>
  );
}

function Pill({ children, active, onClick, size = "md" }) {
  const sm = size === "sm";
  return (
    <button
      type="button"
      onClick={onClick}
      style={{
        padding: sm ? "3px 8px" : "6px 12px",
        borderRadius: 999,
        border: `1.5px solid ${active ? hostTheme.accent.primary : hostTheme.stroke.secondary}`,
        background: active ? hostTheme.fill.primary : hostTheme.bg.elevated,
        color: hostTheme.text.primary,
        fontSize: sm ? 11 : 13,
        fontWeight: active ? 600 : 500,
        cursor: onClick ? "pointer" : "default",
      }}
    >
      {children}
    </button>
  );
}

function Callout({ tone = "info", title, children }) {
  const tones = {
    info: { bg: "#EEF5FC", border: "#BBD9F2", title: "#114A81" },
    success: { bg: "#EAF6ED", border: "#6BB57A", title: "#2E7D3A" },
    warning: { bg: "#FFF4EC", border: "#F5C89A", title: "#C45F1A" },
    neutral: { bg: "#F6F8FA", border: hostTheme.stroke.secondary, title: hostTheme.text.primary },
  };
  const t = tones[tone] || tones.info;
  return (
    <div
      style={{
        padding: "12px 14px",
        borderRadius: 8,
        border: `1px solid ${t.border}`,
        background: t.bg,
      }}
    >
      {title ? (
        <div style={{ fontWeight: 650, fontSize: 13, color: t.title, marginBottom: 4 }}>
          {title}
        </div>
      ) : null}
      <div style={{ fontSize: 12, color: hostTheme.text.secondary, lineHeight: 1.45 }}>
        {children}
      </div>
    </div>
  );
}


/**
 * Move a Shift - Phase 1 prototype (ship build).
 *
 * CANONICAL AUTHORING FILE.
 *   Slug: c-Downloads-Stimulate-stimulate (repo root workspace).
 *   The older c-Downloads-Stimulate-stimulate-stimulate copy is superseded.
 *
 * Source of truth (UX): https://github.com/Shoxys/absence-reallocation-poc
 *   Live: https://shoxys.github.io/absence-reallocation-poc/
 * Plan: ~/.cursor/plans/absence_reallocation_phase_1_a7499538.plan.md
 * Rule: .cursor/rules/absence-reallocation-phase1.mdc
 * After UX edits: npm run build in the POC repo, then push, then update plan + rule.
 *
 * WHAT CHANGED IN THIS REVISION
 * 1. Ship skin locked: blue capacity cells, people pips, heat on short-staffed hours.
 *    The 14-skin design lab and the confirm-layout A/B are gone. Right sidebar only.
 * 2. Full-screen application, not a framed mock. Real CSS with media queries, so the
 *    layout responds to the actual viewport instead of a Desktop/Mobile toggle.
 * 3. Capacity is per campus (Gardens Point 10, Kelvin Grove 3), not one global number,
 *    and pips render the campus capacity rather than a fixed ten dots.
 * 4. Naming: "Move a Shift", "Active Shift Moves", "Move a Shift for a PLF".
 *    No "absence", no "swap", no "override" in user-facing copy.
 * 5. Admin-only "Move a Shift Settings" screen. SSP sees the two operational screens only.
 *
 * EXPORT CONTRACT (build-from-canvas.mjs)
 * - Keep the default export name AbsenceReallocationPhase1Prototype.
 * - Styling lives in the CSS constant below, injected as a <style> element, so the same
 *   file renders identically in the canvas panel and in the exported static page. This is
 *   deliberately closer to the real Bootstrap 3 + CSS implementation than inline styles were.
 * - Only useCanvasState is imported from cursor/canvas; the build polyfills it.
 */
const CSS = `
.mvs, .mvs * { box-sizing: border-box; }
.mvs {
  /* Warmer, lighter blues: the old set read cold on large fills. */
  --blue-900: #0F3D6B;
  --blue-800: #14528C;
  --blue-600: #2C7BC9;
  --blue-400: #7FB3E3;
  --blue-300: #AED2F0;
  --blue-200: #C7E0F5;
  --blue-100: #DCECFA;
  --blue-50:  #F2F8FD;

  /* Action colours. Blue carries capacity information only; green means go, red means leaving. */
  --go:        #2E7D3A;
  --go-strong: #256B30;
  --go-line:   #6BB57A;
  --go-fill:   #EAF6ED;
  --leave:      #C42A1E;
  --leave-line: #E8A49E;
  --leave-fill: #FDECEA;
  --ink-900: #1B2430;
  --ink-700: #384250;
  --ink-500: #5A6572;
  --ink-400: #8B95A1;
  --line:    #E4E9EF;
  --surface: #F6F8FA;
  --white:   #FFFFFF;
  --rose:      #9F1239;
  --rose-fill: #FFF1F2;
  --amber:      #B45309;
  --amber-fill: #FFF7ED;
  --amber-line: #F5C89A;

  --cell-h: 72px;

  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 13px;
  line-height: 1.45;
  color: var(--ink-900);
  background: var(--surface);
}

/* ---------- app chrome ---------- */
.mvs__bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  height: 46px;
  background: var(--blue-800);
  color: var(--white);
}
.mvs__brand { font-weight: 600; font-size: 13px; letter-spacing: .1px; }
.mvs__spacer { flex: 1 1 auto; }
.mvs__who { font-size: 12px; color: rgba(255,255,255,.85); }
.mvs__demo {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 4px 3px 8px; border-radius: 999px;
  background: rgba(255,255,255,.12);
}
.mvs__demo span { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: rgba(255,255,255,.7); }
.mvs__demo button {
  border: 0; border-radius: 999px; cursor: pointer;
  padding: 3px 9px; font: inherit; font-size: 11px; font-weight: 600;
  background: transparent; color: rgba(255,255,255,.8);
}
.mvs__demo button[data-on="1"] { background: var(--white); color: var(--blue-800); }

.mvs__body { flex: 1 1 auto; display: flex; min-height: 0; }
.mvs__nav {
  flex: 0 0 196px; width: 196px;
  background: var(--blue-900);
  padding: 12px 0;
  overflow-y: auto;
}
.mvs__navhead {
  padding: 4px 16px 8px; font-size: 10px; font-weight: 700;
  letter-spacing: .6px; color: rgba(255,255,255,.5);
}
.mvs__navitem {
  display: block; width: 100%; text-align: left;
  padding: 8px 16px; font: inherit; font-size: 12.5px;
  color: rgba(255,255,255,.72); background: transparent;
  border: 0; border-left: 3px solid transparent; cursor: pointer;
}
.mvs__navitem:hover { color: var(--white); background: rgba(255,255,255,.06); }
.mvs__navitem[data-on="1"] {
  color: var(--white); background: rgba(31,111,191,.34); border-left-color: var(--blue-400); font-weight: 600;
}
.mvs__main { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding: 14px 18px 22px; }
/* The timetable fills the viewport: it is the one screen that earns the width.
   Only the reading-heavy screens (tables, forms, pick lists) get a comfort cap. */
.page { width: 100%; }
.page--narrow { max-width: 960px; }
/* Step 1 is a single focused column: the rail must not span three times the list it labels. */
.page--step1 { max-width: 720px; }
/* Shared column for stepper, PLF picker, and pick list — one vertical anchor. */
.flow { width: 100%; max-width: 720px; }
.flow .pg__banner { margin-bottom: 14px; }

/* ---------- page furniture ---------- */
.pg__title { margin: 0; font-size: 18px; font-weight: 650; }
.pg__sub { margin: 3px 0 0; color: var(--ink-500); font-size: 12.5px; max-width: 72ch; }
.pg__head { margin-bottom: 14px; }
.pg__head--row { display: flex; align-items: flex-start; gap: 12px; }
.pg__banner {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px 20px; flex-wrap: wrap; margin-bottom: 12px;
}
.pg__banner .pg__head { flex: 1 1 200px; min-width: 0; margin-bottom: 0; }
.btn--back {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; flex: 0 0 auto; margin-top: 1px;
}

/* Compact inline stepper — sits on the title row so it does not eat a full card. */
.steps {
  display: flex; align-items: center; justify-content: flex-end;
  gap: 0; flex: 0 1 auto; width: auto; max-width: 100%;
  margin: 0; padding: 4px 0;
  border: 0; background: transparent; overflow: visible;
}
.stepwrap { display: flex; align-items: center; flex: 0 0 auto; }
.step { display: flex; align-items: center; gap: 7px; color: var(--ink-400); }
.step b {
  width: 24px; height: 24px; border-radius: 999px; flex: 0 0 24px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1.5px solid var(--line);
  color: var(--ink-400); font-size: 12px; font-weight: 700;
}
.step__t { font-size: 12.5px; white-space: nowrap; }
.step[data-on="1"] { color: var(--blue-800); font-weight: 650; }
.step[data-on="1"] b {
  background: var(--blue-600); border-color: var(--blue-600); color: var(--white);
  box-shadow: 0 0 0 3px var(--blue-100);
}
.step[data-done="1"] { color: var(--ink-500); }
.step[data-done="1"] b { background: var(--go-fill); border-color: var(--go-line); color: var(--go); }
.step__arrow { color: var(--ink-400); flex: 0 0 auto; margin: 0 8px; width: 14px; height: 14px; }

.note {
  border: 1px solid var(--blue-200); background: var(--blue-50);
  border-radius: 8px; padding: 9px 12px; color: var(--ink-700); font-size: 12px;
}
.note--warn { border-color: var(--amber-line); background: var(--amber-fill); color: var(--amber); }
.note--quiet { border-color: var(--line); background: var(--white); color: var(--ink-500); }

/* ---------- filters ---------- */
.filters {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 11px; margin-bottom: 12px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--white);
}
.filters__label {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: .4px;
  text-transform: uppercase; color: var(--ink-400);
}
.filters__count {
  padding: 1px 6px; border-radius: 999px; background: var(--blue-600);
  color: var(--white); font-size: 10px; font-weight: 700; letter-spacing: 0;
}
.filters__clear {
  border: 0; background: transparent; color: var(--blue-600);
  font: inherit; font-size: 11.5px; cursor: pointer; text-decoration: underline;
}
.filters__rule { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }

.chip {
  padding: 4px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--white);
  font: inherit; font-size: 11.5px; color: var(--ink-700);
}
.chip:hover { border-color: var(--blue-300); }
.chip[data-on="1"] { border-color: var(--blue-600); background: var(--blue-50); color: var(--blue-800); font-weight: 600; }
.chip--rose[data-on="1"] { border-color: var(--rose); background: var(--rose-fill); color: var(--rose); }

.search {
  flex: 1 1 160px; min-width: 120px;
  padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px;
  font: inherit; font-size: 12px; color: var(--ink-900); background: var(--white);
}
.search:focus { outline: 2px solid var(--blue-200); outline-offset: 0; border-color: var(--blue-600); }

/* ---------- layout: content + confirm sidebar ---------- */
.work { display: flex; align-items: flex-start; gap: 14px; width: 100%; }
.work__main { flex: 1 1 0%; min-width: 0; }
.work__side { flex: 0 0 320px; width: 320px; position: sticky; top: 0; }

/* ---------- week grid ---------- */
/* overflow-x must stay auto at every width: with visible overflow the min-width table
   spills out of its flex box and renders underneath the confirm sidebar.
   Tooltips open downwards and the wrap reserves room for the last row instead. */
.gridwrap {
  overflow-x: auto;
  border: 1px solid var(--line); border-radius: 8px; background: var(--white);
  padding-bottom: 40px; margin-bottom: -28px;
}
.grid { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 820px; }
.grid th {
  position: sticky; top: 0; z-index: 1;
  padding: 8px 6px; font-size: 11.5px; font-weight: 650; color: var(--ink-500);
  background: var(--surface); border-bottom: 1px solid var(--line); text-align: center;
}
.grid th.grid__timehead { width: 78px; text-align: right; padding-right: 10px; }
.grid td { padding: 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.grid tr:last-child td { border-bottom: 0; }
.grid__time {
  width: 78px; text-align: right; padding-right: 10px !important;
  font-size: 11.5px; color: var(--ink-500); white-space: nowrap; padding-top: 12px !important;
}

/* ---------- slot cell ---------- */
/* Fixed height on every cell: a shorter cell reads as a shorter session, which is not a thing. */
.cell {
  position: relative; width: 100%; height: var(--cell-h);
  display: flex; flex-direction: column; gap: 4px; justify-content: center;
  padding: 9px 11px; border-radius: 8px; text-align: left;
  border: 1px solid var(--line); background: var(--white);
  font: inherit; color: var(--ink-900); cursor: default; overflow: hidden;
}
.cell--click { cursor: pointer; }
.cell--click:hover { border-color: var(--blue-400); }
/* no session: a quiet gap, so the eye lands on real hours */
.cell--empty { height: var(--cell-h); border: 1px dashed var(--line); background: var(--surface); }

/* Capacity is the ONLY thing blue says. Heat = a bolder border on short-staffed hours. */
.cell--needs { background: var(--blue-100); border: 2px solid var(--blue-400); }
.cell--avail { background: var(--white); border-color: var(--line); }
.cell--cov   { background: var(--white); border-color: var(--line); }
.cell--full  { background: var(--surface); border-color: var(--line); opacity: .58; }
.cell--over  { background: var(--surface); border-color: var(--line); opacity: .58; }

/* Selection speaks in green (go) and red (leaving), never in another blue. */
.cell--mine    { background: var(--white); border: 1.5px dashed var(--ink-400); }
.cell--leaving { background: var(--blue-800); border: 2px solid var(--blue-800); }
.cell--join    { background: var(--go-fill); border: 2px solid var(--go); box-shadow: 0 0 0 3px rgba(46,125,58,.16); }

.cell__top { display: flex; align-items: center; gap: 6px; }
.cell__count { font-size: 15px; font-weight: 700; color: var(--ink-900); }
.cell__own { font-size: 14px; font-weight: 650; }
.cell__own--mine { color: var(--ink-700); }
.cell__own--leaving { color: #fff; }
.cell__hint { font-size: 11.5px; color: var(--ink-400); }
.cell__hint--on { color: rgba(255,255,255,.78); }

/* "Join 1" reads as a badge pinned to the corner, not a line competing with the count. */
.cell__badge {
  position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 11px; border-radius: 999px;
  background: var(--go); color: #fff;
  font-size: 12.5px; font-weight: 700; letter-spacing: .2px;
  box-shadow: 0 1px 4px rgba(46,125,58,.35);
}
.lrow__badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 999px;
  background: var(--go); color: #fff; font-size: 10.5px; font-weight: 700;
}
.cell__of { font-weight: 500; color: var(--ink-400); font-size: 12.5px; }
.cell__meta {
  min-height: 22px;
  display: flex; align-items: center; flex-shrink: 0;
}
.cell__state { font-size: 12px; color: var(--ink-500); }
.cell__names { font-size: 11px; color: var(--ink-500); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell__more { border: 0; background: transparent; padding: 0; font: inherit; font-size: 11px; color: var(--blue-600); cursor: pointer; text-decoration: underline; }
.cell__all { margin: 2px 0 0; padding: 0; list-style: none; font-size: 11px; color: var(--ink-500); }
.cell__all li { display: flex; gap: 5px; padding: 1px 0; }

.pips { display: flex; gap: 2px; flex-wrap: wrap; align-items: center; }
.pip { width: 7px; height: 7px; border-radius: 2px; background: var(--line); }
.pip[data-on="1"] { background: var(--blue-600); }
.pip--over { background: var(--amber); }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 6px; border-radius: 4px;
  font-size: 10px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase;
}
.tag--yours   { background: var(--surface); color: var(--ink-500); border: 1px solid var(--line); }
.tag--leaving { background: var(--blue-800); color: var(--white); }
.tag--join    { background: var(--go); color: var(--white); }
.tag--over    { background: var(--amber-fill); color: var(--amber); border: 1px solid var(--amber-line); }
.tag__x { border: 0; background: transparent; color: inherit; cursor: pointer; font: inherit; font-size: 12px; line-height: 1; padding: 0 0 0 2px; }

.cell__foot {
  min-height: 24px; display: flex; align-items: center; flex-shrink: 0;
}
.needs {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  background: #FEF2F2; color: #BE123C; border: 1px solid #FECDD3;
  font-size: 10.5px; font-weight: 600; white-space: nowrap; line-height: 1.2;
}
.needs--muted { opacity: .55; }

/* ---------- tooltip ---------- */
.tip { position: relative; display: inline-flex; }
.tip--block { display: block; width: 100%; }
.tip__b {
  position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  z-index: 40; width: max-content; max-width: 230px;
  padding: 7px 9px; border-radius: 6px;
  background: var(--ink-900); color: var(--white);
  font-size: 11px; font-weight: 400; line-height: 1.4; text-transform: none; letter-spacing: 0;
  opacity: 0; visibility: hidden; transition: opacity .12s;
  pointer-events: none; text-align: left;
}
.tip:hover .tip__b { opacity: 1; visibility: visible; }
/* :focus-within alone kept the bubble open after a click; :focus-visible fires for keyboard only. */
.tip:has(:focus-visible) .tip__b { opacity: 1; visibility: visible; }
.tip:active .tip__b { opacity: 0; visibility: hidden; }

/* ---------- step 1: one panel (who + hours + actions) ---------- */
.step1 { width: 100%; }
.step1panel {
  border: 1px solid var(--line); border-radius: 10px; background: var(--white);
  overflow: visible;
}
.step1panel__who {
  padding: 14px 18px 13px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px 10px 0 0;
}

.pickrow {

}

/* ---------- browse list ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.lrow {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 10px 12px; border-radius: 8px; text-align: left;
  border: 1px solid var(--line); background: var(--white);
  font: inherit; color: var(--ink-900); cursor: default;
}
.lrow--click { cursor: pointer; }
.lrow--click:hover { border-color: var(--blue-400); }
.lrow--needs { background: var(--blue-100); border-color: var(--blue-400); }

.lrow--cov   { background: var(--white); border-color: var(--line); }
.lrow--full  { background: var(--surface); opacity: .6; }
.lrow--over  { background: var(--surface); opacity: .6; }
.lrow--mine    { border: 1.5px dashed var(--ink-400); }
.lrow--leaving { background: var(--blue-800); border: 2px solid var(--blue-800); }
.lrow--join    { background: var(--go-fill); border: 2px solid var(--go); }
.lrow__when { flex: 0 0 116px; font-size: 12.5px; font-weight: 600; }
.lrow__mid { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.lrow__end { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

/* ---------- confirm sidebar ---------- */
.side {
  border: 1px solid var(--line); border-radius: 8px; background: var(--white);
  display: flex; flex-direction: column; overflow: hidden;
}
.side__head { padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.side__title { font-size: 12.5px; font-weight: 650; }
.side__match { font-size: 11.5px; margin-top: 2px; color: var(--ink-500); }
.side__match b { color: var(--blue-800); }
.side__body { padding: 10px 12px; display: flex; flex-direction: column; gap: 12px; }
.side__group { display: flex; flex-direction: column; gap: 6px; }
.side__label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--ink-400); }
.side__foot { padding: 10px 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }

.pick {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--white);
}
.pick--leave { border-left: 3px solid var(--blue-800); }
.pick--join  { border-left: 3px solid var(--go); }
.pick--stale { border-color: var(--amber-line); background: var(--amber-fill); }
.pick__main { flex: 1 1 auto; min-width: 0; }
.pick__when { font-size: 12px; font-weight: 600; }
.pick__meta { font-size: 11px; color: var(--ink-500); }
.pick__warn { font-size: 11px; color: var(--amber); margin-top: 2px; }
.faclist { margin: 2px 0 3px; padding: 0; list-style: none; }
.faclist li { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; }
.faclist__disc { color: var(--ink-400); flex: 0 0 auto; }
.pick__x { border: 0; background: transparent; color: var(--ink-400); cursor: pointer; font: inherit; font-size: 14px; line-height: 1; }
.waiting {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 10px; border-radius: 6px;
  border: 1.5px dashed var(--go-line); background: var(--go-fill);
}
.waiting__n {
  flex: 0 0 20px; width: 20px; height: 20px; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--white); border: 1.5px solid var(--go-line);
  color: var(--go); font-size: 11px; font-weight: 700;
}
.waiting__t { font-size: 12px; color: var(--go-strong); font-weight: 600; }
.pick__x:hover { color: var(--ink-900); }

.btn {
  padding: 8px 13px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--white); color: var(--ink-900);
  font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.btn:hover { border-color: var(--blue-400); }
.btn--primary { background: var(--blue-600); border-color: var(--blue-600); color: var(--white); }
.btn--primary:hover { background: var(--blue-800); border-color: var(--blue-800); }
.btn--block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--line); background: var(--white); color: var(--ink-900); }
.btn--primary:disabled:hover { background: var(--blue-600); border-color: var(--blue-600); color: var(--white); }
.btn--link { border: 0; background: transparent; color: var(--blue-600); text-decoration: underline; padding: 0; font-weight: 500; }

/* ---------- tables and cards ---------- */
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--white); overflow: hidden; }
.card--table { overflow: visible; }
.card__head { padding: 11px 13px; border-bottom: 1px solid var(--line); background: var(--surface); }
.card__title { font-size: 13px; font-weight: 650; }
.card__sub { font-size: 11.5px; color: var(--ink-500); margin-top: 2px; }
.card__body { padding: 13px; }

.tblwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
.tbl col.c-plf   { width: 14%; }
.tbl col.c-leave { width: 22%; }
.tbl col.c-join  { width: 22%; }
.tbl col.c-hrs   { width: 8%; }
.tbl col.c-by    { width: 14%; }
.tbl col.c-act   { width: 20%; }
.tbl th {
  text-align: left; padding: 10px 14px; font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px; color: var(--ink-400);
  border-bottom: 1px solid var(--line); background: var(--surface); white-space: nowrap;
}
.tbl td {
  padding: 12px 14px; border-bottom: 1px solid var(--line);
  font-size: 12.5px; vertical-align: top;
  overflow-wrap: break-word; word-break: break-word;
}
.tbl tbody tr:hover { background: var(--blue-50); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl__plf { font-weight: 650; font-size: 13px; }
.tbl__sub { font-size: 11px; color: var(--ink-500); margin-top: 2px; }
.tbl__hrs { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl__act { text-align: right; vertical-align: middle; }
.tbl__act-inner {
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: flex-end; gap: 6px;
}
.colhead { display: inline-flex; align-items: center; gap: 6px; }
.colhead::before { content: ""; width: 6px; height: 6px; border-radius: 999px; }
.colhead--leave::before { background: var(--leave); }
.colhead--join::before { background: var(--go); }
.btn--danger { border-color: var(--leave-line); color: var(--leave); }

.tbl__when { font-weight: 600; }
.pill {
  display: inline-block; padding: 2px 8px; border-radius: 999px;

}

.pill--over { background: var(--amber-fill); color: var(--amber); border: 1px solid var(--amber-line); cursor: help; }
.mv { position: relative; padding-left: 11px; line-height: 1.5; }
.mv::before {
  content: ""; position: absolute; left: 0; top: 6px;
  width: 4px; height: 4px; border-radius: 999px;
}
.mv--leave::before { background: var(--leave); }
.mv--join::before { background: var(--go); }

/* ---------- PLF picker ---------- */
.plfpick { margin: 0; width: 100%; border: 0; background: transparent; overflow: visible; }
.plfpick .card__body { padding: 0; }
.plfpick__body { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.plfpick__field {
  flex: 1 1 240px; min-width: 180px; max-width: none;
  display: flex; flex-direction: row; align-items: center; gap: 10px;
}
.plfpick__field .side__label { flex: 0 0 auto; margin: 0; }
.plfpick__disc { flex: 0 0 auto; }
.plfpick__inputwrap { position: relative; }
.plfpick__inputwrap .search { width: 100%; flex: none; padding: 7px 11px; }
.plfpick__body .tip { flex: 0 0 auto; }
.plfpick__menu {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30;
  background: var(--white); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 10px 26px rgba(0,0,0,.12); overflow: hidden; max-height: 220px; overflow-y: auto;
}
.plfpick__opt {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; text-align: left; padding: 9px 12px;
  border: 0; background: transparent; font: inherit; font-size: 12.5px; cursor: pointer;
}
.plfpick__opt:hover { background: var(--blue-50); }
.plfpick__cur { font-size: 10px; color: var(--ink-400); }
.plfpick__none { padding: 12px; font-size: 12px; color: var(--ink-500); }

.empty { padding: 30px 18px; text-align: center; }
.empty__t { font-size: 13.5px; font-weight: 650; }
.empty__s { font-size: 12px; color: var(--ink-500); margin: 4px 0 12px; }

/* ---------- settings ---------- */
.settings { max-width: 720px; }
.sec { margin-bottom: 18px; }
.sec__head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 9px; flex-wrap: wrap; }
.sec__title { font-size: 12.5px; font-weight: 650; }
.sec__note { font-size: 11.5px; color: var(--ink-500); }

.captiles { display: flex; gap: 10px; flex-wrap: wrap; }
.captile {
  flex: 1 1 158px; min-width: 158px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--white); padding: 12px;
  display: flex; flex-direction: column; gap: 7px;
}
.captile__name { font-size: 12.5px; font-weight: 600; }
.captile__hint { font-size: 10.5px; color: var(--ink-400); margin-top: -5px; }
.captile__row { display: flex; align-items: center; gap: 7px; }
.captile__unit { font-size: 11.5px; color: var(--ink-500); }
.num {
  width: 56px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
  font: inherit; font-size: 14px; font-weight: 700; text-align: center;
  background: var(--white); color: var(--ink-900);
}
.num:focus { outline: 2px solid var(--blue-200); border-color: var(--blue-600); }

.rules { border: 1px solid var(--line); border-radius: 8px; background: var(--white); padding: 0 13px; }
.rule { display: flex; align-items: center; gap: 11px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rule:last-child { border-bottom: 0; }
.rule__main { flex: 1 1 auto; min-width: 0; }
.rule__label { font-size: 12.5px; font-weight: 600; }
.rule__hint { font-size: 11px; color: var(--ink-500); margin-top: 1px; }
.rule__prev { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.rule__prevlabel { font-size: 10px; color: var(--ink-400); }

  display: flex; flex-direction: column; gap: 2px;

  font-size: 11.5px; opacity: .75;
}

}

}

  padding: 11px 14px; border-radius: 8px;
  background: var(--ink-900); color: var(--white); font-size: 12.5px;
  box-shadow: 0 8px 26px rgba(0,0,0,.22);

.only-wide { display: inline; }
.only-narrow { display: none; }

/* ---------- responsive ----------
   Default is laptop (13–15"). Roomier cells only kick in on large desktops.
   <=1100  sidebar stacks under the grid
   <=900   portrait iPad and below: list only
   <=560   phone
------------------------------------ */

@media (min-width: 1600px) {
  .mvs__main { padding: 18px 24px 28px; }
  .mvs { --cell-h: 88px; }
  .work__side { flex-basis: 332px; width: 332px; }
  .work { gap: 16px; }
  .grid td { padding: 5px; }
  .cell { padding: 10px 12px; }
  .cell__count { font-size: 15.5px; }
  .pg__title { font-size: 19px; }
  .step b { width: 26px; height: 26px; flex-basis: 26px; font-size: 12.5px; }
}

@media (min-width: 1920px) {
  .mvs { --cell-h: 100px; }
  .mvs__main { padding: 22px 32px 34px; }
  .work__side { flex-basis: 352px; width: 352px; }
}

/* Below 1100px the sidebar stops competing with the grid for width and stacks under it,
   full-bleed. align-items must become stretch or the column children shrink to content. */
@media (max-width: 1100px) {
  .work { flex-direction: column; align-items: stretch; }
  .work__main { width: 100%; }
  .work__side {
    position: sticky; bottom: 0; top: auto;
    flex: 0 0 auto; width: 100%; max-width: none; z-index: 30;
    box-shadow: 0 -6px 20px rgba(0,0,0,.10);
    max-height: 52vh; overflow-y: auto;
  }
  .side__body { display: flex; flex-direction: row; flex-wrap: wrap; gap: 14px; }
  .side__group { flex: 1 1 260px; min-width: 240px; }
}

@media (max-width: 1100px) and (min-width: 901px) {
  .mvs { --cell-h: 68px; }
  .cell { padding: 7px 8px; }
  .grid th.grid__timehead, .grid__time { width: 62px; }
  .mvs__nav { flex-basis: 164px; width: 164px; }
}

@media (max-width: 900px) {
  .mvs__nav { display: none; }
  .mvs__main { padding: 14px 14px 96px; }
  .gridwrap { display: none; }
  .only-wide { display: none; }
  .only-narrow { display: block; }
  .mvs__tabs { display: flex; }
  .lrow__when { flex-basis: 96px; }
  .pg__banner { flex-direction: column; align-items: flex-start; gap: 8px; }
  .pg__banner .steps { justify-content: flex-start; }
  .steps { padding: 0; }
  .step__arrow { margin: 0 7px; width: 13px; height: 13px; }
  .step b { width: 22px; height: 22px; flex-basis: 22px; font-size: 11.5px; }
  .step__t { font-size: 12px; }
  .settings { max-width: none; }
  .plfpick__body { align-items: stretch; }
}

@media (max-width: 560px) {
  .mvs__bar { height: auto; padding: 7px 12px; flex-wrap: wrap; gap: 8px; }
  .mvs__who { display: none; }
  .mvs__main { padding: 12px 11px 96px; }
  .pg__title { font-size: 16px; }
  .step1 { max-width: none; }
  .flow { max-width: none; }
  /* phone: numbered rail only, the active label alone keeps its text */
  .steps { padding: 0; }
  .step__t { display: none; }
  .step[data-on="1"] .step__t { display: inline; font-size: 12px; }
  .step__arrow { margin: 0 6px; width: 12px; height: 12px; }
  .step b { width: 22px; height: 22px; flex-basis: 22px; font-size: 11.5px; }
  .filters { gap: 6px; padding: 8px; }
  .filters .chip { font-size: 11px; padding: 4px 8px; }
  .lrow { flex-wrap: wrap; gap: 7px; }
  .lrow__when { flex-basis: 100%; }
  .lrow__end { flex-basis: 100%; flex-direction: row; align-items: center; }
  .captiles { flex-direction: column; }
  .captile { min-width: 0; }
  .rule { flex-wrap: wrap; }
  .rule__prev { width: 100%; padding-left: 49px; }
  .work__side { max-height: 60vh; }
  /* touch targets */
  .btn { padding: 10px 14px; }
  .chip { padding: 6px 11px; }
}

/* Day chips scroll rather than wrapping into a tall stack on narrow screens. */
@media (max-width: 900px) {
  .filters { flex-wrap: nowrap; overflow-x: auto; }
  .filters > * { flex: 0 0 auto; }
  .filters .search { flex: 1 0 150px; }
}

@media (min-width: 901px) { .mvs__tabs { display: none; } }

.mvs__tabs {
  gap: 6px; padding: 8px 12px; background: var(--white);
  border-bottom: 1px solid var(--line); overflow-x: auto; flex: 0 0 auto;
}
.mvs__tabs .chip { white-space: nowrap; }

        }} onChange={(e) => setQ(e.target.value)}/>
            {open ? (<div className="plfpick__menu">
                {matches.length === 0 ? (<div className="plfpick__none">No PLF matches that search.</div>) : (matches.map((n) => (<button key={n} type="button" className="plfpick__opt" onClick={() => {
                    props.onPick(n);
                    setOpen(false);
                    setQ("");
                }}>
                      {n}
                      {n === props.who ? <span className="plfpick__cur">current</span> : null}
                    </button>)))}
              </div>) : null}
          </div>
        </div>
        <Tip text="Phase 1 moves stay on the PLF's own discipline roster.">
          <span className="pill pill--active plfpick__disc">{DISCIPLINE.full}</span>
        </Tip>
      </div>
    </div>);
}
function MoveFlow(props) {
    const keyp = props.self ? "mvs_p_" : "mvs_a_";
    const [stage, setStage] = useCanvasState(keyp + "stage", "choose");
    const [leave, setLeave] = useCanvasState(keyp + "leave", []);
    const [join, setJoin] = useCanvasState(keyp + "join", []);
    const [applied, setApplied] = useCanvasState(keyp + "applied", null);
    const [view, setView] = useCanvasState(keyp + "view", "week");
    const [openOnly, setOpenOnly] = useCanvasState(keyp + "fopen", false);
    const [needsOnly, setNeedsOnly] = useCanvasState(keyp + "fneeds", false);
    const [day, setDay] = useCanvasState(keyp + "fday", "All");
    const [query, setQuery] = useCanvasState(keyp + "fq", "");
    const canExceed = props.role !== "plf";
    function st(s) {
        return stateOf(s, { caps: props.caps, applied, leave, join, stage, role: props.role, canExceed });
    }
    // A join target that filled up between load and confirm. Mocked as always empty here,
    // but the shape is real: commit 4 needs to handle slot_full mid-flight.
    const stale = [];
    function toggleLeave(id) {
        setLeave(leave.indexOf(id) >= 0 ? leave.filter((x) => x !== id) : leave.concat([id]));
    }
    function toggleJoin(id) {
        if (join.indexOf(id) >= 0) {
            setJoin(join.filter((x) => x !== id));
            return;
        }
        if (join.length >= leave.length)
            return;
        setJoin(join.concat([id]));
    }
    /**
     * One click handler for the whole grid. Your own hours toggle as leave (so more can be
     * added without going back a step); everything else toggles as a join target.
     */
    function pick(id) {
        if (MY_SHIFTS.indexOf(id) >= 0) {
            if (leave.indexOf(id) >= 0) {
                dropLeave(id);
            }
            else {
                setLeave(leave.concat([id]));
            }
            return;
        }
        toggleJoin(id);
    }
    function dropLeave(id) {
        if (leave.length <= 1)
            return;
        const next = leave.filter((x) => x !== id);
        setLeave(next);
        if (join.length > next.length)
            setJoin(join.slice(0, next.length));
    }
    function reset() {
        setStage("choose");
        setLeave([]);
        setJoin([]);
    }
    const mine = SLOTS.filter((s) => MY_SHIFTS.indexOf(s.id) >= 0 && (!applied || applied.leave.indexOf(s.id) < 0));
    /* ---- step 1 ---- */
    if (stage === "choose") {
        const allMine = SLOTS.filter((s) => MY_SHIFTS.indexOf(s.id) >= 0);
        const noRoster = allMine.length === 0;
        return (<div className="page page--step1">
        <div className="flow">
        <div className="pg__banner">
        <div className="pg__head">
          <h1 className="pg__title">{props.self ? "Move a Shift" : "Move a Shift for a PLF"}</h1>
          <p className="pg__sub">
            {props.self
                ? "Move hours you cannot make to other hours in the same week. Your total hours stay the same."
                : "Move hours for a PLF on their discipline roster. Their total hours stay the same."}
          </p>
        </div>
        <Steps stage="choose"/>
        </div>

        <div className="step1panel">
        {!props.self ? (<div className="step1panel__who">
          <PlfSearch who={props.who} onPick={(n) => props.onPickWho && props.onPickWho(n)}/>
        </div>) : null}

        {mine.length === 0 ? (
            <div className="empty">
              <div className="empty__t">
                {noRoster ? "No rostered hours this week" : "No hours available to move this week"}
              </div>
              <div className="empty__s">
                {noRoster
                    ? "Add your availabilities so the team can roster you. Once hours are assigned, you can move them here."
                    : "Every rostered hour is already moved or marked absent this week."}
              </div>
              {noRoster && props.self ? (<button type="button" className="btn btn--primary" style={{ marginTop: 4 }}>
                  Add availabilities
                </button>) : null}
            </div>
          ) : (<>
            {!props.self ? (<div className="step1panel__hint">Select the hours {props.who} should leave</div>) : null}
            <div className="list">
              {mine.map((s) => {
                    // Step 1 is a plain pick list: which hours, nothing else.
                    // Staffing detail belongs to step 2, where you are choosing where to go.
                    const on = leave.indexOf(s.id) >= 0;
                    return (<button key={s.id} type="button" className={"pickrow" + (on ? " pickrow--on" : "")} onClick={() => toggleLeave(s.id)}>
                    <span className={"pickrow__box" + (on ? " pickrow__box--on" : "")}>
                      {on ? <Check /> : null}
                    </span>
                    <span className="pickrow__main">
                      <span className="pickrow__when">
                        {s.day} {s.start}
                      </span>
                      <span className="pickrow__where">{CAMPUS[s.campus].name}</span>
                    </span>
                  </button>);
                })}
            </div>
            <div className="step1panel__foot">
              <span className="pickrow__where">
                {leave.length} of {mine.length} selected
              </span>
              <button type="button" className="btn btn--primary" disabled={leave.length === 0} onClick={() => setStage("join")}>
                Continue
              </button>
            </div>
          </>)}
        </div>
        {props.self ? (<p className="pickrow__where step1__abs">
              Cannot make it at all?{" "}
              <button type="button" className="btn btn--link">
                Report an absence
              </button>{" "}
              instead.
            </p>) : null}
        </div>
      </div>);
    }
    /* ---- step 2 and 3 ---- */
    const visible = SLOTS.filter((s) => {
        const state = st(s);
        // Your own hours and anything already picked always stay on screen: a filter must never
        // hide a selection or the hours you are allowed to add as leave.
        const pinned = state.mine || state.leaving || state.joining;
        if (openOnly && state.band !== "needs" && !pinned)
            return false;
        if (needsOnly && hasDiscipline(s) && !pinned)
            return false;
        if (day !== "All" && s.day !== day && !pinned)
            return false;
        if (query) {
            const hay = (s.day + " " + s.start + " " + CAMPUS[s.campus].name + " " + s.people.map((p) => p.name).join(" ")).toLowerCase();
            if (hay.indexOf(query.toLowerCase()) < 0)
                return false;
        }
        return true;
    });
    const grid = {};
    visible.forEach((s) => {
        grid[s.day + "-" + s.timeKey] = s;
    });
    return (<div className="page">
      <div className="pg__banner">
      <div className="pg__head pg__head--row">
        <button type="button" className="btn btn--back" onClick={() => setStage("choose")}>
          <BackArrow /> Back
        </button>
        <div>
          <h1 className="pg__title">{props.self ? "Move a Shift" : "Move a Shift for " + props.who}</h1>
          <p className="pg__sub">
            Choose {leave.length} {plural(leave.length, "hour", "hours")} to join. Full hours are closed.
          </p>
        </div>
      </div>
      <Steps stage="join"/>
      </div>

      <Filters view={view} onView={setView} openOnly={openOnly} needsOnly={needsOnly} day={day} query={query} onOpen={() => setOpenOnly(!openOnly)} onNeeds={() => setNeedsOnly(!needsOnly)} onDay={setDay} onQuery={setQuery} onClear={() => {
            setOpenOnly(false);
            setNeedsOnly(false);
            setDay("All");
            setQuery("");
        }}/>

      <div className="work">
        <div className="work__main">
          {visible.length === 0 ? (<div className="card">
              <div className="empty">
                <div className="empty__t">No hours match these filters</div>
                <div className="empty__s">Clear a filter to see more of the week.</div>
              </div>
            </div>) : null}

          {view === "week" ? (<div className="gridwrap">
              <table className="grid">
                <thead>
                  <tr>
                    <th className="grid__timehead">Time</th>
                    {DAYS.map((d) => (<th key={d}>{d}</th>))}
                  </tr>
                </thead>
                <tbody>
                  {TIMES.map((t) => (<tr key={t.key}>
                      <td className="grid__time">{t.label}</td>
                      {DAYS.map((d) => {
                    const s = grid[d + "-" + t.key];
                    return (<td key={d}>
                            {s ? (<SlotCell st={st(s)} showExact={props.showExact} onPick={pick} onDrop={dropLeave}/>) : (
                        // Filtered out or no session: a quiet gap, nothing to read.
                        <span className="cell cell--empty"/>)}
                          </td>);
                })}
                    </tr>))}
                </tbody>
              </table>
            </div>) : null}

          <div className={view === "week" ? "only-narrow" : ""}>
            <div className="list" style={{ marginTop: view === "week" ? 0 : 0 }}>
              {visible.map((s) => (<SlotRow key={s.id} st={st(s)} showExact={props.showExact} onPick={pick} onDrop={dropLeave}/>))}
            </div>
          </div>
        </div>

        <div className="work__side">
          <ConfirmSide who={props.who} self={props.self} leave={leave} join={join} caps={props.caps} canExceed={canExceed} stale={stale} onDropLeave={dropLeave} onDropJoin={(id) => setJoin(join.filter((x) => x !== id))} onApply={() => {
            setApplied({ leave: leave, join: join });
            props.onApplied(leave, join);
            reset();
        }} onBack={() => setStage("choose")}/>
        </div>
      </div>
    </div>);
}
/* ---------------------------------------------------------------- SSP screens */
function ActiveMoves(props) {
    return (<div className="page page--narrow">
      <div className="pg__head">
        <h1 className="pg__title">Active Shift Moves</h1>
        <p className="pg__sub">
          Temporary moves for this week. Cancelling a move puts every hour in it back where it started.
        </p>
      </div>

      {props.moves.length === 0 ? (<div className="card">
          <div className="empty">
            <div className="empty__t">No active moves this week</div>
            <div className="empty__s">When a PLF moves their hours, or you move hours for them, the move appears here.</div>
            <button type="button" className="btn btn--primary" onClick={props.onAssign}>
              Move a shift for a PLF
            </button>
          </div>
        </div>) : (<>
          <div style={{ marginBottom: 12 }}>
            <button type="button" className="btn btn--primary" onClick={props.onAssign}>
              Move a shift for a PLF
            </button>
          </div>
          <div className="card card--table">
            <div className="tblwrap">
            <table className="tbl">
              <colgroup>
                <col className="c-plf"/>
                <col className="c-leave"/>
                <col className="c-join"/>
                <col className="c-hrs"/>
                <col className="c-by"/>
                <col className="c-act"/>
              </colgroup>
              <thead>
                <tr>
                  <th>PLF</th>
                  <th>
                    <span className="colhead colhead--leave">Leaving</span>
                  </th>
                  <th>
                    <span className="colhead colhead--join">Joining</span>
                  </th>
                  <th>Hours</th>
                  <th>Arranged by</th>
                  <th className="tbl__act">Status</th>
                </tr>
              </thead>
              <tbody>
                {props.moves.map((m) => (<tr key={m.id}>
                    <td>
                      <div className="tbl__plf">{m.plf}</div>
                    </td>
                    <td>
                      {m.leave.map((x, i) => (<div key={i} className="mv mv--leave">
                          {x}
                        </div>))}
                    </td>
                    <td>
                      {m.join.map((x, i) => (<div key={i} className="mv mv--join">
                          {x}
                        </div>))}
                    </td>
                    <td className="tbl__hrs">
                      {Math.max(m.leave.length, m.join.length)}{" "}
                      {plural(Math.max(m.leave.length, m.join.length), "hour", "hours")}
                    </td>
                    <td>{m.by}</td>
                    <td className="tbl__act">
                      <div className="tbl__act-inner">
                      {m.overflowReason ? (<span className="pill pill--over" title={m.overflowReason}>
                          Over capacity
                        </span>) : null}
                      <span className="pill pill--active">
                        Active
                      </span>
                      <Tip text={"Cancels all " +
                    m.leave.length +
                    " leaving and " +
                    m.join.length +
                    " joining " +
                    plural(m.join.length, "hour", "hours") +
                    ". Moves cannot be cancelled in part."}>
                        <button type="button" className="btn btn--danger btn--compact" onClick={() => props.onCancel(m.id)}>
                          Cancel move
                        </button>
                      </Tip>
                      </div>
                    </td>
                  </tr>))}
              </tbody>
            </table>
            </div>
          </div>
        </>)}
    </div>);
}
function CapTile(props) {
    return (<div className="captile">
      <div className="captile__name">{props.name}</div>
      <div className="captile__hint">{props.hint}</div>
      <div className="captile__row">
        <input className="num" type="number" min={1} value={props.value} onChange={(e) => props.onChange(Math.max(1, parseInt(e.target.value || "1", 10)))}/>
        <span className="captile__unit">per hour</span>
      </div>
      <Pips count={props.value} max={props.value}/>
    </div>);
}
function Switch(props) {
    return (<button type="button" className={"sw" + (props.on ? " sw--on" : "")} disabled={props.locked} onClick={props.onClick} aria-pressed={props.on}>
      <span className="sw__dot"/>
    </button>);
}
function Rule(props) {
    // Control sits beside its label, not flung to the far edge of the page.
    return (<div className="rule">
      <Switch on={props.on} locked={props.locked} onClick={props.onToggle}/>
      <div className="rule__main">
        <div className="rule__label">{props.label}</div>
        <div className="rule__hint">{props.hint}</div>
      </div>
      {props.preview ? props.preview : null}
      {props.locked ? <span className="rule__fixed">Fixed</span> : null}
    </div>);
}
function Settings(props) {
    return (<div className="settings">
      <div className="pg__head">
        <h1 className="pg__title">Move a Shift Settings</h1>
        <p className="pg__sub">Administrators only. SSPs can move shifts but cannot change these.</p>
      </div>

      <div className="sec">
        <div className="sec__head">
          <span className="sec__title">Capacity per campus</span>
          <span className="sec__note">PLFs cannot move into a full hour.</span>
        </div>
        <div className="captiles">
          <CapTile name="Gardens Point" hint="All GP rooms" value={props.caps.gp} onChange={(n) => props.onCaps({ gp: n, kg: props.caps.kg, online: props.caps.online })}/>
          <CapTile name="Kelvin Grove" hint="Smaller rooms" value={props.caps.kg} onChange={(n) => props.onCaps({ gp: props.caps.gp, kg: n, online: props.caps.online })}/>
          <CapTile name="Online" hint="Not room limited" value={props.caps.online} onChange={(n) => props.onCaps({ gp: props.caps.gp, kg: props.caps.kg, online: n })}/>
        </div>
      </div>

      <div className="sec">
        <div className="sec__head">
          <span className="sec__title">Rules</span>
        </div>
        <div className="rules">
          <Rule label="Show exact numbers to PLFs on full hours" hint="SSPs and admins always see the count. This only changes the PLF view." on={props.showExact} onToggle={() => props.onShowExact(!props.showExact)} preview={<span className="rule__prev">
                <span className="rule__prevlabel">A PLF sees</span>
                <span className="rule__prevcell">
                  <span style={{ fontWeight: 650 }}>Full</span>
                  {props.showExact ? <span className="cell__hint">13 of 3 · 10 over</span> : null}
                </span>
              </span>}/>
          <Rule label="SSPs and admins may exceed capacity" hint="Warns, then asks for an optional reason." on locked/>
        </div>
      </div>

      <div className="note note--warn">
        Some hours were rostered above these limits before capacity existed. They keep their people and
        show as over capacity. Nobody is removed automatically.
      </div>
    </div>);
}
function ReportAbsenceStub(props) {
    return (<div>
      <div className="pg__head">
        <h1 className="pg__title">Report an Absence</h1>
        <p className="pg__sub">Existing flow, unchanged in Phase 1. Shown here only to place Move a Shift beside it.</p>
      </div>
      <div className="card">
        <div className="card__body">
          <div className="note">
            Reporting an absence tells the team you will not be there and leaves the hour empty. If you can still work,
            but at a different time, <button type="button" className="btn btn--link" onClick={props.onMove}>move the shift</button>{" "}
            instead so the hour stays covered. Hours you have joined through a move cannot be marked absent until an SSP reverses the move.
          </div>
        </div>
      </div>
    </div>);
}
/* ---------------------------------------------------------------- shell */
function AbsenceReallocationPhase1Prototype() {
    const [role, setRole] = useCanvasState("mvs_role", "plf");
    const [screen, setScreen] = useCanvasState("mvs_screen", "move");
    const [caps, setCaps] = useCanvasState("mvs_caps", DEFAULT_CAPS);
    const [showExact, setShowExact] = useCanvasState("mvs_exact", false);
    const [moves, setMoves] = useCanvasState("mvs_moves", SEED_MOVES);
    const [who, setWho] = useCanvasState("mvs_who", PLF_OPTIONS[0]);
    const [toast, setToast] = useCanvasState("mvs_toast", null);
    const isPlf = role === "plf";
    const exactFor = isPlf ? showExact : true;
    const nav = isPlf
        ? [
            { id: "move", label: "Move a Shift" },
            { id: "absence", label: "Report an Absence" },
        ]
        : role === "ssp"
            ? [
                { id: "active", label: "Active Shift Moves" },
                { id: "assign", label: "Move a Shift for a PLF" },
            ]
            : [
                { id: "active", label: "Active Shift Moves" },
                { id: "assign", label: "Move a Shift for a PLF" },
                { id: "settings", label: "Move a Shift Settings" },
            ];
    const allowed = nav.map((n) => n.id);
    const current = allowed.indexOf(screen) >= 0 ? screen : nav[0].id;
    function applyMove(plf, leave, join, by) {
        const next = {
            id: Date.now(),
            plf,
            leave: leave.map((id) => {
                const s = byId(id);
                return s ? fmtSlot(s) : id;
            }),
            join: join.map((id) => {
                const s = byId(id);
                return s ? fmtSlot(s) : id;
            }),
            by,
            status: "active",
        };
        setMoves([next].concat(moves));
        setToast("Move applied. " +
            leave.length +
            " " +
            plural(leave.length, "hour", "hours") +
            " moved.");
    }
    return (<div className="mvs">
      <style>{CSS}</style>

      <div className="mvs__bar">
        <span className="mvs__brand">Student Success, STEM Support</span>
        <span className="mvs__spacer"/>
        <span className="mvs__demo">
          <span>Preview as</span>
          <button type="button" data-on={role === "plf" ? "1" : "0"} onClick={() => {
            setRole("plf");
            setScreen("move");
        }}>
            PLF
          </button>
          <button type="button" data-on={role === "ssp" ? "1" : "0"} onClick={() => {
            setRole("ssp");
            setScreen("active");
        }}>
            SSP
          </button>
          <button type="button" data-on={role === "admin" ? "1" : "0"} onClick={() => {
            setRole("admin");
            setScreen("active");
        }}>
            Admin
          </button>
        </span>
        <span className="mvs__who">Jack A</span>
      </div>

      <div className="mvs__tabs">
        {nav.map((n) => (<button key={n.id} type="button" className="chip" data-on={current === n.id ? "1" : "0"} onClick={() => setScreen(n.id)}>
            {n.label}
          </button>))}
      </div>

      <div className="mvs__body">
        <nav className="mvs__nav">
          <div className="mvs__navhead">{isPlf ? "MY ROSTER" : "ROSTER"}</div>
          {nav.map((n) => (<button key={n.id} type="button" className="mvs__navitem" data-on={current === n.id ? "1" : "0"} onClick={() => setScreen(n.id)}>
              {n.label}
            </button>))}
        </nav>

        <main className="mvs__main">
          {current === "move" ? (<MoveFlow self who="You" role={role} caps={caps} showExact={exactFor} onApplied={(leave, join) => applyMove("You", leave, join, "Self")}/>) : current === "absence" ? (<ReportAbsenceStub onMove={() => setScreen("move")}/>) : current === "assign" ? (<MoveFlow self={false} who={who} role={role} caps={caps} showExact onPickWho={setWho} onApplied={(leave, join) => {
                applyMove(who, leave, join, role === "admin" ? "Jack A (Admin)" : "Jack A (SSP)");
                setScreen("active");
            }}/>) : current === "settings" ? (<Settings caps={caps} onCaps={setCaps} showExact={showExact} onShowExact={setShowExact}/>) : (<ActiveMoves moves={moves} onAssign={() => setScreen("assign")} onCancel={(id) => {
                setMoves(moves.filter((m) => m.id !== id));
                setToast("Move cancelled. Every hour in it is back where it started.");
            }}/>)}
        </main>
      </div>

      {toast ? (<div className="toast">
          <span>{toast}</span>
          <button type="button" onClick={() => setToast(null)}>
            ×
          </button>
        </div>) : null}
    </div>);
}



const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AbsenceReallocationPhase1Prototype />);

  </script>
</body>
</html>
