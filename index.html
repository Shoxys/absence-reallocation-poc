/* Shared keyed state — mirrors Cursor useCanvasState across components */
const __canvasStore = new Map();
const __canvasListeners = new Map();

function useCanvasState(key, initial) {
  const init =
    typeof initial === "function" ? initial : () => initial;
  if (!__canvasStore.has(key)) {
    __canvasStore.set(key, init());
  }
  const [value, setLocal] = useState(() => __canvasStore.get(key));
  useEffect(() => {
    const bump = (next) => setLocal(next);
    let set = __canvasListeners.get(key);
    if (!set) {
      set = new Set();
      __canvasListeners.set(key, set);
    }
    set.add(bump);
    setLocal(__canvasStore.get(key));
    return () => set.delete(bump);
  }, [key]);
  const setValue = (action) => {
    const prev = __canvasStore.get(key);
    const next = typeof action === "function" ? action(prev) : action;
    __canvasStore.set(key, next);
    const set = __canvasListeners.get(key);
    if (set) for (const fn of set) fn(next);
  };
  return [value, setValue];
}

}

function Callout({ tone = "info", title, children }) {
  const tones = {
    info: { bg: "#EEF5FC", border: "#BBD9F2", title: "#114A81" },
    success: { bg: "#EAF6ED", border: "#6BB57A", title: "#2E7D3A" },

    neutral: { bg: "#F6F8FA", border: hostTheme.stroke.secondary, title: hostTheme.text.primary },
  };
  const t = tones[tone] || tones.info;
  return (
    <div
      style={{

        {children}
      </div>
    </div>
  );
}

/* ---------- Timetable picker ---------- */
function TimetablePicker(props) {
    const { role, narrow, confirmLayout, skin, mathStyle = "blend", adminPlf, rosterLabel, rosterCode, onApplied } = props;
    const prefix = role === "admin" ? "p6a" : "p6";
    const [stage, setStage] = useCanvasState(`${prefix}_stage`, "choose");
    const [origins, setOrigins] = useCanvasState(`${prefix}_origins`, []);
    const [targets, setTargets] = useCanvasState(`${prefix}_targets`, []);
    const [phase, setPhase] = useCanvasState(`${prefix}_phase`, "joining");
    const [applied, setApplied] = useCanvasState(`${prefix}_applied`, null);
    const [fNeeds, setFNeeds] = useCanvasState(`${prefix}_fneeds`, false);
    const [fMath, setFMath] = useCanvasState(`${prefix}_fmath`, false);
    const [hint, setHint] = useCanvasState(`${prefix}_hint`, null);
    const [viewPref, setViewPref] = useCanvasState(`${prefix}_view2`, "week");
    const [dayFilter, setDayFilter] = useCanvasState(`${prefix}_day`, "All");
    const [query, setQuery] = useCanvasState(`${prefix}_q`, "");
    // Mobile: list only. Desktop: week by default, list optional.
    const view = narrow ? "list" : viewPref;
    const originSlots = origins.map((id) => slotById(id)).filter((s) => !!s);
    const targetSlots = targets.map((id) => slotById(id)).filter((s) => !!s);
    function trimJoins(nextOrigins) {
        if (targets.length > nextOrigins.length) {
            setTargets(targets.slice(0, nextOrigins.length));
        }
    }
    function removeOrigin(id) {
        if (origins.length <= 1) {
            setHint("Keep At Least One Shift Selected To Leave");
            return;
        }
        const next = origins.filter((x) => x !== id);
        setOrigins(next);
        trimJoins(next);
        setHint(null);
        setPhase("leaving");
    }
    function addOrigin(id) {
        if (!MY_SHIFTS.includes(id))
            return;
        if (origins.includes(id))
            return;
        const next = [...origins, id];
        setOrigins(next);
        setHint(null);
    }
    function removeTarget(id) {
        setTargets(targets.filter((x) => x !== id));
        setPhase("joining");
    }
    function pick(id) {
        // Your shifts: toggle leave (floor of 1)
        if (MY_SHIFTS.includes(id)) {
            if (origins.includes(id)) {
                removeOrigin(id);
            }
            else {
                addOrigin(id);
                // After adding a leave, need another join: clear excess? joins stay, need more
                setPhase("joining");
            }
            return;
        }
        // Join targets
        if (origins.includes(id))
            return;
        if (targets.includes(id)) {
            removeTarget(id);
            return;
        }
        if (targets.length >= origins.length) {
            // Replace last join rather than exceed leave count
            setTargets([...targets.slice(0, origins.length - 1), id]);
            setPhase("joining");
            return;
        }
        setTargets([...targets, id]);
        setPhase("joining");
        setHint(null);
    }
    function confirm() {
        if (origins.length === 0 || targets.length !== origins.length)
            return;
        setApplied({ origins: [...origins], targets: [...targets] });
        const from = originSlots.map(overrideFmt).join(" + ");
        const to = targetSlots.map(overrideFmt).join(" + ");
        onApplied?.({
            message: role === "admin"
                ? `Override Applied For ${adminPlf}`
                : `Moved ${originSlots.map(shortFmt).join(" + ")} → ${targetSlots.map(shortFmt).join(" + ")}`,
            from,
            to,
            hours: origins.length,
        });
        setOrigins([]);
        setTargets([]);
        setStage("choose");
        setPhase("joining");
    }
    function backToChoose() {
        setStage("choose");
        setTargets([]);
        setPhase("joining");
        setHint(null);
    }
    function filteredOut(s) {
        if (fNeeds && !promoted(bandOf(countOf(s, applied))))
            return true;
        if (fMath && hasMath(s))
            return true;
        if (dayFilter !== "All" && s.day !== dayFilter)
            return true;
        if (query.trim()) {
            const q = query.trim().toLowerCase();
            const hay = `${s.day} ${s.start} ${LOC[s.loc]} ${locShort(s.loc)}`.toLowerCase();
            if (!hay.includes(q))
                return true;
        }
        return false;
    }
    const needsCount = SLOTS.filter((s) => bandOf(countOf(s, applied)) === "needs").length;
    const useSidebar = confirmLayout === "sidebar" && !narrow && stage === "move";
    const showTray = (confirmLayout === "tray" || narrow) && stage === "move";
    const listSlots = SLOTS.filter((s) => !filteredOut(s))
        .slice()
        .sort((a, b) => {
        const di = DAYS.indexOf(a.day) -
            DAYS.indexOf(b.day);
        if (di !== 0)
            return di;
        return (TIMES.findIndex((t) => t.key === a.timeKey) - TIMES.findIndex((t) => t.key === b.timeKey));
    });
    if (stage === "choose") {
        return (<ChooseShifts role={role} adminPlf={adminPlf} rosterLabel={rosterLabel} rosterCode={rosterCode} selected={origins} onToggle={(id) => {
                // On the choose screen, allow clearing to re-pick; Continue stays disabled at 0.
                if (origins.includes(id)) {
                    setOrigins(origins.filter((x) => x !== id));
                }
                else {
                    setOrigins([...origins, id]);
                }
                setHint(null);
            }} onContinue={() => {
                if (origins.length === 0)
                    return;
                setTargets([]);
                setPhase("joining");
                setStage("move");
                setHint(null);
            }} applied={applied} onUndoApplied={() => {
                setApplied(null);
                onApplied?.({ message: "Move Undone", from: "", to: "", hours: 0 });
            }}/>);
    }
    const stripProps = {
        origins: originSlots,
        targets: targetSlots,
        phase,
        forAdmin: role === "admin",
        plfName: adminPlf,
        onRemoveOrigin: removeOrigin,
        onRemoveTarget: removeTarget,
        onFocusLeaving: () => setPhase("leaving"),
        onFocusJoining: () => setPhase("joining"),
        onConfirm: confirm,
        onBack: backToChoose,
    };
    const grid = (<Stack gap={8} style={{ padding: narrow ? 10 : 12, flex: 1, minWidth: 0 }}>
      <Stack gap={2}>
        <div style={{ fontSize: 16, fontWeight: 600, color: P.ink900 }}>
          {role === "admin" ? `Join Hours For ${adminPlf}` : "Move A Shift"}
        </div>
        <Text size="small" tone="secondary">
          {role === "admin"
            ? `Leave ${origins.length} · Join ${origins.length} for ${adminPlf}${rosterLabel ? ` · ${rosterLabel}` : ""}`
            : `Leave ${origins.length} · Join ${origins.length} · Undo leave with × (keep ≥1)`}
        </Text>
      </Stack>

      {hint && (<div style={{
                background: P.warnFill,
                borderRadius: 6,
                padding: "8px 10px",
                fontSize: 12,
                color: P.warn,
                fontWeight: 600,
            }}>
          {hint}
        </div>)}

      {!narrow && (<Row gap={4}>
          <Chip label="Week Grid" active={view === "week"} onClick={() => setViewPref("week")}/>
          <Chip label="Browse List" active={view === "list"} onClick={() => setViewPref("list")}/>
        </Row>)}

      {view === "week" && (<Stack gap={6}>
          <Row gap={6} wrap>
            <Chip label={`Open Slots (${needsCount})`} active={fNeeds} onClick={() => setFNeeds(!fNeeds)}/>
            <Chip label="⚠ Needs MATH" active={fMath} onClick={() => setFMath(!fMath)}/>
          </Row>
          <div style={{
                border: `1px solid ${P.line}`,
                borderRadius: 8,
                padding: 8,
                background: P.white,
                overflowX: "auto",
            }}>
            <div style={{
                width: "100%",
                minWidth: 520,
                maxWidth: DEMO_GRID_MAX_W,
                margin: "0 auto",
            }}>
              <div style={{ display: "flex", gap: 5, marginBottom: 4 }}>
                <div style={{ width: 44, flexShrink: 0 }}/>
                {DAYS.map((d) => (<div key={d} style={{
                    flex: "1 1 0",
                    minWidth: 88,
                    textAlign: "center",
                    fontSize: 11,
                    fontWeight: 600,
                    color: P.ink600,
                    padding: "4px 0",
                }}>
                    {d}
                  </div>))}
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                {TIMES.map((t) => (<div key={t.key} style={{
                    display: "flex",
                    gap: 5,
                    alignItems: "stretch",
                }}>
                    <div style={{
                    width: 44,
                    fontSize: 10,
                    color: P.ink400,
                    paddingTop: 8,
                    flexShrink: 0,
                }}>
                      {t.label}
                    </div>
                    {DAYS.map((d) => {
                    const s = SLOTS.find((x) => x.day === d && x.timeKey === t.key);
                    return (<div key={d} style={{ flex: "1 1 0", minWidth: 88 }}>
                          <GridCell slot={s} applied={applied} origins={origins} targets={targets} phase={phase} skin={skin} mathStyle={mathStyle} hidden={!!s && filteredOut(s)} onPick={pick}/>
                        </div>);
                })}
                  </div>))}
              </div>
            </div>
          </div>
        </Stack>)}

      {view === "list" && (<Stack gap={8}>
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search day, time, or location..." style={{
                width: "100%",
                boxSizing: "border-box",
                fontSize: 13,
                padding: "9px 11px",
                borderRadius: 8,
                border: `1px solid ${P.line}`,
                background: P.white,
                color: P.ink900,
            }}/>
          <Row gap={4} wrap>
            {["All", ...DAYS].map((d) => (<span key={d}>
                <Chip label={d} active={dayFilter === d} onClick={() => setDayFilter(d)}/>
              </span>))}
          </Row>
          <Row gap={4} wrap>
            <Chip label={`Open Slots (${needsCount})`} active={fNeeds} onClick={() => setFNeeds(!fNeeds)}/>
            <Chip label="⚠ Needs MATH" active={fMath} onClick={() => setFMath(!fMath)}/>
          </Row>
          <Text size="small" tone="tertiary">
            {listSlots.length} Slot{listSlots.length === 1 ? "" : "s"}
          </Text>
          <Stack gap={8}>
            {(dayFilter === "All" ? [...DAYS] : [dayFilter]).map((day) => {
                const daySlots = listSlots.filter((s) => s.day === day);
                if (daySlots.length === 0)
                    return null;
                return (<div key={day}>
                  <Stack gap={5}>
                    <Text size="small" weight="semibold" style={{ color: P.ink600 }}>
                      {day}
                    </Text>
                    {daySlots.map((s) => (<div key={s.id}>
                        <SlotListRow slot={s} applied={applied} origins={origins} targets={targets} phase={phase} skin={skin} mathStyle={mathStyle} onPick={pick}/>
                      </div>))}
                  </Stack>
                </div>);
            })}
            {listSlots.length === 0 && (<Text size="small" tone="tertiary">
                No Slots Match These Filters
              </Text>)}
          </Stack>
        </Stack>)}

    </Stack>);
    if (useSidebar) {
        return (<div style={{ display: "flex", alignItems: "stretch", width: "100%" }}>
        <div style={{ flex: 1, minWidth: 0 }}>{grid}</div>
        <SidebarConfirm {...stripProps}/>
      </div>);
    }
    return (<div style={{ display: "flex", flexDirection: "column", width: "100%" }}>
      <div>{grid}</div>
      {showTray && (<div style={{ position: "sticky", bottom: 0, zIndex: 5 }}>
          <MatchStrip {...stripProps}/>
        </div>)}
    </div>);
}

            Week 6 · {active.length} Active · Leave hours must match join hours
          </Text>
        </Stack>
        <Btn variant="primary" onClick={props.onAssign}>
          Assign Override
        </Btn>
      </Row>

      {active.length === 0 ? (<div style={{
                border: `1px dashed ${P.line}`,
                borderRadius: 8,
                padding: 20,
                background: P.surface,
                textAlign: "center",
            }}>
          <Stack gap={8}>
            <Text weight="semibold">No Active Overrides</Text>
            <Text size="small" tone="secondary">
              Assign an override for a PLF when they cannot move their own shift.
            </Text>
            <div>
              <Btn variant="primary" onClick={props.onAssign}>
                Assign Override
              </Btn>
            </div>
          </Stack>
        </div>) : (<div style={{ border: `1px solid ${P.line}`, borderRadius: 8, overflow: "hidden" }}>
          {active.map((r) => (<div key={r.id} style={{ padding: "12px 14px", borderBottom: `1px solid ${P.line}` }}>
              <Row gap={10} align="center" wrap>
                <Stack gap={2} style={{ minWidth: 110, flex: "0 1 140px" }}>
                  <Text size="small" weight="semibold">
                    {r.plf}
                  </Text>
                  <Text size="small" tone="tertiary">
                    {r.by === "Self" ? "Self move" : "Assigned by SSP"} · {r.hours}h
                  </Text>
                </Stack>
                <Stack gap={2} style={{ flex: "1 1 220px", minWidth: 180 }}>
                  <Text size="small">
                    <span style={{ color: "#C42A1E", fontWeight: 600 }}>Leave</span>
                    <span style={{ color: P.ink400 }}> · </span>
                    <span style={{ color: P.ink900 }}>{r.from}</span>
                  </Text>
                  <Text size="small">
                    <span style={{ color: P.green, fontWeight: 600 }}>Join</span>
                    <span style={{ color: P.ink400 }}> · </span>
                    <span style={{ color: P.ink900 }}>{r.to}</span>
                  </Text>
                </Stack>
                <span style={{
                    fontSize: 10,
                    fontWeight: 700,
                    color: P.green,
                    background: P.greenFill,
                    border: `1px solid ${P.greenBorder}`,
                    borderRadius: 999,
                    padding: "2px 8px",
                    flexShrink: 0,
                }}>
                  Active
                </span>
                <Spacer />
                <Btn variant="danger" onClick={() => setRows(rows.map((x) => (x.id === r.id ? { ...x, status: "cancelled" } : x)))}>
                  Cancel
                </Btn>
              </Row>
            </div>))}
        </div>)}

      <Text size="small" tone="tertiary">
        Cancel removes the override instantly. Assign Override opens the PLF picker + matched
        leave/join flow on the primary MATH roster.
      </Text>
    </Stack>);
}
function AdminAssign(props) {
    const [plf, setPlf] = useCanvasState("p6a_plf", PLF_OPTIONS[0]);
    const [plfSearch, setPlfSearch] = useCanvasState("p6a_plf_q", PLF_OPTIONS[0]);
    const [toast, setToast] = useCanvasState("p6a_toast", null);
    const [, setRows] = useCanvasState("p6_rows", SEED_OVERRIDES);
    const roster = PRIMARY_ROSTER;
    const matches = PLF_OPTIONS.filter((p) => p.toLowerCase().includes(plfSearch.trim().toLowerCase()));
    function pickPlf(name) {
        setPlf(name);
        setPlfSearch(name);
    }
    return (<Stack gap={0} style={{ flex: 1, minHeight: 0, height: "100%" }}>
      <div style={{
            padding: "6px 10px",
            borderBottom: `1px solid ${P.line}`,
            background: P.surface,
            flexShrink: 0,
        }}>
        <Row gap={8} align="center" wrap>
          <button type="button" onClick={props.onDone} style={{
            display: "inline-flex",
            alignItems: "center",
            gap: 4,
            fontSize: 12,
            fontWeight: 600,
            color: P.blue600,
            background: P.white,
            border: `1px solid ${P.blue200}`,
            borderRadius: 6,
            padding: "5px 10px",
            cursor: "pointer",
            flexShrink: 0,
        }}>
            ← Active
          </button>
          <div style={{ position: "relative", flex: "1 1 180px", minWidth: 140, maxWidth: 260 }}>
            <input value={plfSearch} onChange={(e) => {
            setPlfSearch(e.target.value);
            const hit = PLF_OPTIONS.find((p) => p.toLowerCase() === e.target.value.trim().toLowerCase());
            if (hit)
                setPlf(hit);
        }} placeholder="Search PLF…" style={{
            width: "100%",
            boxSizing: "border-box",
            fontSize: 12,
            fontWeight: 600,
            padding: "5px 8px",
            borderRadius: 6,
            border: `1px solid ${P.line}`,
            background: P.white,
            color: P.ink900,
        }}/>
            {plfSearch.trim() &&
            matches.length > 0 &&
            !(matches.length === 1 && matches[0] === plf) && (<div style={{
                position: "absolute",
                top: "100%",
                left: 0,
                right: 0,
                zIndex: 8,
                marginTop: 2,
                background: P.white,
                border: `1px solid ${P.line}`,
                borderRadius: 6,
                boxShadow: "0 4px 12px rgba(0,0,0,0.08)",
                maxHeight: 140,
                overflowY: "auto",
            }}>
                  {matches.map((p) => (<button key={p} type="button" onClick={() => pickPlf(p)} style={{
                    display: "block",
                    width: "100%",
                    textAlign: "left",
                    padding: "6px 8px",
                    border: "none",
                    background: p === plf ? P.blue50 : P.white,
                    fontSize: 12,
                    color: P.ink900,
                    cursor: "pointer",
                }}>
                      {p}
                    </button>))}
                </div>)}
          </div>
          <span title="Primary discipline roster (read-only)" style={{
            display: "inline-flex",
            alignItems: "center",
            gap: 5,
            background: P.blue50,
            border: `1px solid ${P.blue200}`,
            borderRadius: 6,
            padding: "4px 8px",
            fontSize: 12,
            fontWeight: 600,
            color: P.blue800,
            flexShrink: 0,
        }}>
            <DiscIcon code={roster.code} size={12}/>
            {roster.code} roster
          </span>
        </Row>
      </div>
      <TimetablePicker role="admin" narrow={props.narrow} confirmLayout={props.confirmLayout} skin={props.skin} mathStyle={props.mathStyle} adminPlf={plf} rosterLabel={roster.label} rosterCode={roster.code} onApplied={(info) => {
            setToast(info.message);
            if (info.hours > 0) {
                setRows((prev) => [
                    {
                        id: Date.now(),
                        plf,
                        from: info.from,
                        to: info.to,
                        by: "SSP",
                        hours: info.hours,
                        status: "active",
                    },
                    ...prev,
                ]);
            }
        }}/>
      {toast && (<div style={{ padding: 10 }}>
          <Row gap={8}>
            <Text size="small">{toast}</Text>
            <Spacer />
            <Btn onClick={props.onDone}>View Active</Btn>
          </Row>
        </div>)}
    </Stack>);
}

function AbsenceReallocationPhase1Prototype() {

        </Stack>

    return (<Stack gap={8} style={{ padding: 12 }}>
